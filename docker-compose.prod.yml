# Usage:
#   cp .env.prod.example .env.prod   # fill in your values
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

services:
  api:
    image: ${HISAABO_API_IMAGE:-ghcr.io/hisaabo/hisaabo-api:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hisaabo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hisaabo}
      NODE_ENV: production
      PORT: 3000
      UV_THREADPOOL_SIZE: "8"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hisaabo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-hisaabo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${POSTGRES_USER:-hisaabo}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-hisaabo-backups}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_data:/var/backups/hisaabo

volumes:
  pgdata:
  backup_data:
