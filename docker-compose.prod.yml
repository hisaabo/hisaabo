# Usage:
#   cp .env.prod.example .env.prod   # fill in your values
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

services:
  api:
    image: ${HISAABO_API_IMAGE:-ghcr.io/hisaabo/hisaabo-api:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hisaabo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hisaabo}
      NODE_ENV: production
      PORT: 3000
      UV_THREADPOOL_SIZE: "8"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hisaabo}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
