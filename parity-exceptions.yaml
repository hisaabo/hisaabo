# parity-exceptions.yaml
#
# Procedures intentionally excluded from specific platforms.
# Everything else is auto-detected from source code by scripts/check-parity.ts.
#
# If a procedure exists on web but not on mobile and is NOT listed here,
# the parity check will flag it as a gap and CI will fail.
#
# To add an exception: list the procedure under the relevant platform's
# not-applicable key and explain WHY in a comment.
#
# Schema: procedure names use "router.procedure" form (same as trpc.X.Y calls).

schema_version: "2.0"

exceptions:
  mobile:
    not-applicable:
      # --- Multi-Tenancy ---
      # Mobile derives current tenant info from auth.me; the standalone
      # procedure is not needed.
      - tenant.current

      # --- Business ---
      # Admin/compliance feature. Desktop-only; not meaningful on mobile.
      - business.auditTrail
      # Bulk data export requires file system access; not available on mobile.
      - business.exportData
      # Business logo upload/delete are web-only (canvas-based resize, file picker).
      # Mobile displays the logo via /api/businesses/:id/logo but doesn't edit.
      - business.uploadLogo
      - business.deleteLogo
      # Point-of-Sale mode is a web/desktop-only fullscreen register.
      # Mobile doesn't have a POS terminal surface.
      - business.setPosEnabled
      - business.ensureWalkInParty

      # --- Backup & Restore ---
      # Tenant-level backup/restore is a web + CLI workflow; not available on mobile.
      - selfExport.request
      - selfImport.request

      # --- Parties ---
      # Tally integration is an accounting desktop workflow.
      - party.tallyExport

      # --- Invoicing ---
      # Used by web to pre-fill delivery method on re-send. Mobile uses
      # expo-sharing which has no delivery-method concept.
      - invoice.lastDeliveryMethod

      # --- Document Types ---
      # Debit Notes — rare document type; intentionally omitted from mobile.
      - debitNote.list
      - debitNote.getById
      - debitNote.create
      - debitNote.updateStatus
      - debitNote.delete
      # Purchase Returns — rare document type; intentionally omitted from mobile.
      - purchaseReturn.list
      - purchaseReturn.getById
      - purchaseReturn.create
      - purchaseReturn.updateStatus
      - purchaseReturn.delete

      # --- Payments ---
      # Bulk bank-account assignment for untracked payments is a desktop
      # admin workflow.
      - payment.untrackedPayments
      - payment.assignAccount

      # --- Dashboard / Analytics ---
      # Complex charting analytics; intentionally desktop-only.
      - dashboard.salesTrend
      - dashboard.topCustomers
      - dashboard.topSellingItems
      - dashboard.paymentModeBreakdown
      - dashboard.collectionEfficiency
      - dashboard.expenseCategoryBreakdown
      - dashboard.monthlyComparison

      # --- GST Compliance ---
      # GST compliance reports are complex accounting workflows; desktop-only.
      - gst.gstr1
      - gst.gstr1CSV
      - gst.gstr3b

      # --- Online Store Admin ---
      # Store settings and item-visibility management are admin setup
      # workflows; intentionally desktop-only.
      - store.getSettings
      - store.updateSettings
      - store.checkSlug
      - store.listStoreItems
      - store.bulkToggleItems
      - store.updateItemStoreSettings
      - store.updateVariantStoreSettings

      # --- Data Import ---
      # Bulk CSV import is a desktop/power-user workflow.
      - import.importParties
      - import.importItems
      - import.importInvoices
      - import.importPayments
      - import.importTransfers
      - import.reconcileDirectPayments

      # --- Sales Targets ---
      # Sales target management is a desktop admin workflow.
      - target.list
      - target.myTargets
      - target.create
      - target.update
      - target.delete
      - target.getProgress

      # --- Reports ---
      # Complex reporting workflows; intentionally desktop-only.
      - reports.daybook
      - reports.outstanding
      - reports.salesRegister
      - reports.purchaseRegister
      - reports.taxSummary
      - reports.cashFlowForecast
      - reports.collectionEfficiency
      - reports.itemSales
      - reports.stockSummary
      - reports.partyStatement
      - reports.paymentSummary

      # --- API Keys ---
      # Developer/integration feature; desktop-only.
      - apiKey.list
      - apiKey.create
      - apiKey.revoke

      # --- Recurring Invoices ---
      # Suggestions engine analyzes recent invoices — heavy query
      # better suited to web/desktop; mobile shows templates only.
      - recurringInvoice.suggestions

      # --- Onboarding ---
      # Web-only onboarding flows for invite acceptance via browser.
      # Mobile uses invite deep links and its own onboarding screens.
      - tenant.myInvitations
      - tenant.acceptById
      - tenant.peekInvitation

      # --- Chart of Accounts ---
      # Accounting management is a desktop/CA workflow.
      - account.list
      - account.create
      - account.update
      - account.delete

      # --- Journal Entries ---
      # Journal entries are CA adjustments — desktop accounting workflow.
      - journal.list
      - journal.getById
      - journal.create
      - journal.update
      - journal.void
      - journal.delete
      - journal.templateList
      - journal.templateCreate
      - journal.templateDelete
      - journal.createFromTemplate

      # --- ITC Tracking ---
      # ITC is GST compliance for CAs — desktop workflow.
      - itc.dashboard
      - itc.ledger
      - itc.markBlocked
      - itc.markEligible
      - itc.agingAlerts
      - itc.recordUtilization
      - itc.gstr3bTable4

      # --- Bank Reconciliation ---
      # Bank recon requires CSV upload and review — desktop workflow.
      - bankRecon.uploadCSV
      - bankRecon.confirmMapping
      - bankRecon.importList
      - bankRecon.importDetail
      - bankRecon.lines
      - bankRecon.confirmMatch
      - bankRecon.manualMatch
      - bankRecon.unmatch
      - bankRecon.createExpense
      - bankRecon.ignoreLine
      - bankRecon.summary
      - bankRecon.ruleList
      - bankRecon.ruleCreate
      - bankRecon.ruleUpdate
      - bankRecon.ruleDelete
      - bankRecon.templateList
      - bankRecon.templateCreate
      - bankRecon.templateDelete
      - bankRecon.templateFork

      # --- E-Invoicing ---
      # E-invoicing is GST compliance — desktop workflow.
      - eInvoice.configure
      - eInvoice.getConfig
      - eInvoice.testConnection
      - eInvoice.generate
      - eInvoice.cancel
      - eInvoice.retryFailed
      - eInvoice.bulkRetry
      - eInvoice.dashboard
      - eInvoice.getStatus

      # --- E-Way Bill ---
      # E-way bill management is compliance — desktop workflow.
      - ewayBill.generate
      - ewayBill.cancel
      - ewayBill.updateVehicle
      - ewayBill.extend
      - ewayBill.getByInvoice
      - ewayBill.dashboard
      - ewayBill.expiringList

      # --- GSTR-2B Reconciliation ---
      # GSTR-2B upload and reconciliation — desktop accounting workflow.
      - gstr2b.upload
      - gstr2b.uploads
      - gstr2b.records
      - gstr2b.summary
      - gstr2b.missingInBooks
      - gstr2b.missingIn2B
      - gstr2b.linkInvoice
      - gstr2b.ignoreRecord

      # --- Additional GST Reports ---
      - gst.gstr9
      - gst.gstr9Json
      - gst.gstr1Json
      - gst.cmp08

      # --- Additional Reports ---
      - reports.trialBalance
      - reports.balanceSheet
      - reports.profitAndLoss
      - reports.generalLedger
      - reports.cashFlowStatement
      - reports.comparativeTrialBalance
      - reports.comparativeBalanceSheet
      - reports.comparativeProfitAndLoss
      - reports.tallyExport

      # --- HSN ---
      - hsn.search
      - hsn.validate
      - hsn.validateForTurnover

  cli:
    not-applicable:
      # --- Auth ---
      # Browser-only flows requiring email verification links / callbacks.
      - auth.requestEmailChange
      - auth.sendMagicLink
      - auth.verifyMagicLink

      # --- Tenant ---
      # Invite acceptance and org management are browser/mobile flows.
      # CLI authenticates via API key; doesn't accept invitations or create orgs.
      - tenant.acceptInvitation
      - tenant.acceptById
      - tenant.canCreateOrg
      - tenant.create
      - tenant.myInvitations
      - tenant.peekInvitation

      # --- Business ---
      # Plan limit check — CLI doesn't create businesses.
      - business.canCreate
      # Logo upload/delete are browser-only (canvas resize + file picker).
      - business.uploadLogo
      - business.deleteLogo
      # Point-of-Sale is a browser-only UI feature — no CLI command surface.
      - business.setPosEnabled
      - business.ensureWalkInParty

      # --- Bank ---
      # Manual transaction entry — rare admin workflow. CLI uses transfer
      # and reconciliation commands instead.
      - bankAccount.addTransaction

      # --- Dashboard ---
      # Separate procedure from expensesByCategory (which CLI has).
      # Adds per-vendor breakdown — low-priority for CLI.
      - dashboard.expenseCategoryBreakdown

      # --- Import ---
      # Bank transfer import and payment reconciliation — complex admin
      # workflows. Standard import (parties/items/invoices/payments) is covered.
      - import.importTransfers
      - import.reconcileDirectPayments

      # --- Parties ---
      # Tally accounting integration — desktop-specific export format.
      - party.tallyExport

      # --- Bank Reconciliation ---
      # Interactive CSV upload + review workflow — not suited for CLI.
      - bankRecon.uploadCSV
      - bankRecon.confirmMapping
      - bankRecon.importDetail
      - bankRecon.lines
      - bankRecon.confirmMatch
      - bankRecon.manualMatch
      - bankRecon.unmatch
      - bankRecon.ignoreLine
      - bankRecon.templateCreate
      - bankRecon.templateDelete
      - bankRecon.templateFork

      # --- E-Invoicing ---
      # Configuration requires interactive credential input.
      - eInvoice.configure
      - eInvoice.getConfig
      - eInvoice.testConnection

      # --- GSTR-2B ---
      # CSV upload and per-record ignore are interactive UI workflows — not CLI.
      - gstr2b.upload
      - gstr2b.ignoreRecord

  mcp:
    not-applicable:
      # --- Auth ---
      # MCP runs as a pre-authenticated server-side agent. It does not
      # manage user sessions, login flows, or account registration.
      - auth.completeProfile
      - auth.login
      - auth.logout
      - auth.logoutAll
      - auth.me
      - auth.register
      - auth.requestEmailChange
      - auth.sendMagicLink
      - auth.updateName
      - auth.verifyMagicLink

      # --- Tenant ---
      # Invite acceptance and org management are browser/mobile flows.
      # MCP agents don't accept invitations or create orgs.
      - tenant.acceptInvitation
      - tenant.acceptById
      - tenant.canCreateOrg
      - tenant.create
      - tenant.myInvitations
      - tenant.peekInvitation

      # --- Backup & Restore ---
      # Tenant-level backup/restore requires file I/O; not an MCP workflow.
      - selfExport.request
      - selfImport.request

      # --- Business ---
      # Plan limit check — MCP agents don't create businesses.
      - business.canCreate
      # Logo is a browser UI concern; MCP agents don't manage brand assets.
      - business.uploadLogo
      - business.deleteLogo
      # POS mode is a web/desktop-only cashier surface; not an MCP workflow.
      - business.setPosEnabled
      - business.ensureWalkInParty

      # --- Bank ---
      # Manual transaction entry — rare admin workflow.
      - bankAccount.addTransaction

      # --- Business ---
      # Admin/compliance and bulk export — not core MCP agent workflows.
      - business.auditTrail
      - business.exportData

      # --- Dashboard / Analytics ---
      # MCP focuses on data CRUD, not visualization. Agents needing
      # analytics can use the summary endpoint; detailed dashboard
      # breakdowns are designed for human-facing UIs.
      - dashboard.collectionEfficiency
      - dashboard.expenseCategoryBreakdown
      - dashboard.invoiceStatusBreakdown
      - dashboard.monthlyComparison
      - dashboard.paymentModeBreakdown
      - dashboard.profitAndLoss
      - dashboard.receivablesAging
      - dashboard.salesTrend
      - dashboard.topCustomers
      - dashboard.topSellingItems

      # --- Import ---
      # Bank transfer import and payment reconciliation — admin workflows.
      - import.importTransfers
      - import.reconcileDirectPayments

      # --- Parties ---
      # Tally accounting integration — desktop-specific export format.
      - party.tallyExport

      # --- Bank Reconciliation ---
      # Interactive CSV upload flow — MCP agents use structured data.
      - bankRecon.uploadCSV
      - bankRecon.confirmMapping
      - bankRecon.templateCreate
      - bankRecon.templateDelete
      - bankRecon.templateFork
      - bankRecon.templateUpdate

      # --- E-Invoicing ---
      # Credential management not for MCP agents.
      - eInvoice.configure
      - eInvoice.getConfig
      - eInvoice.testConnection

      # --- Chart of Accounts ---
      # Accounting management is a desktop/CA workflow — read-only reporting sufficient for agents.
      - account.list

      # --- Bank Reconciliation ---
      # Import detail view is part of the interactive CSV review flow.
      - bankRecon.importDetail

      # --- GSTR-2B ---
      # CSV upload and per-record ignore are interactive UI workflows.
      - gstr2b.upload
      - gstr2b.ignoreRecord
