services:
  postgres:
    image: postgres:16-alpine
    container_name: billbook-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: billbook
      POSTGRES_PASSWORD: billbook_dev
      POSTGRES_DB: billbook
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
