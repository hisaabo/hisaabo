services:
  postgres:
    image: postgres:16-alpine
    container_name: hisaabo-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hisaabo
      POSTGRES_PASSWORD: hisaabo_dev
      POSTGRES_DB: hisaabo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaabo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
