# ── Append to postgresql.conf for WAL-based PITR ───────────────
# This enables continuous WAL archiving for point-in-time recovery.
#
# 1. Copy this to your PostgreSQL data dir or include it:
#    include = '/etc/postgresql/16/main/conf.d/wal.conf'
#
# 2. Create archive directory:
#    mkdir -p /var/lib/postgresql/wal_archive
#    chown postgres:postgres /var/lib/postgresql/wal_archive
#
# 3. Restart PostgreSQL:
#    systemctl restart postgresql

# Enable WAL archiving
wal_level = replica
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'

# WAL settings for reliability
max_wal_senders = 3
wal_keep_size = 1GB

# Checkpoint tuning (balance between performance and recovery time)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# Write-ahead log reliability
synchronous_commit = on
fsync = on
full_page_writes = on
