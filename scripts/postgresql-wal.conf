# ── WAL-based PITR for Hisaabo ONCE container ──────────────────
# This enables continuous WAL archiving for point-in-time recovery.
#
# Loaded via: -c include=/etc/postgresql/wal.conf
# Archive dir: /storage/wal_archive (persisted on ONCE shared volume)

# Enable WAL archiving
wal_level = replica
archive_mode = on
archive_command = 'cp %p /storage/wal_archive/%f'

# WAL settings for reliability
max_wal_senders = 3
wal_keep_size = 1GB

# Checkpoint tuning (balance between performance and recovery time)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# Write-ahead log reliability
synchronous_commit = on
fsync = on
full_page_writes = on
