# ── Hisaabo Production PostgreSQL Tuning ────────────────────
# Sized for ONCE containers (typically 1-2 GB RAM, 1-2 vCPU)
# Loaded via: -c include=/etc/postgresql/tuning.conf

# ── Memory ──────────────────────────────────────────────────
# shared_buffers is set inline (-c shared_buffers=128MB)
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 384MB

# ── Query Planning ──────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Logging ─────────────────────────────────────────────────
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# ── Statistics ──────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = all
