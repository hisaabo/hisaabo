name: Release

on:
  push:
    tags:
      - "v*"
  # Recovery only: re-run a release whose image push partially failed. Run it
  # on the tag ref (a branch fails the version check). See `force` in the
  # docker job.
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite image tags that already exist for this version (recovery from a partial failure only; releases are otherwise immutable)"
        type: boolean
        default: false

# Least privilege: read-only by default. Jobs that publish or sign request
# exactly the extra scopes they need (id-token for npm Trusted Publishing and
# cosign keyless signing, packages for GHCR, contents:write for release assets).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detect what changed since last tag ─────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      store: ${{ steps.filter.outputs.store }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every deployed artifact reads its version from the committed manifests
      # (web/desktop UI and API from package.json, Tauri from tauri.conf.json,
      # Android from app.json, npm from the package). Refuse a tag that does
      # not match them all, so a release can never ship mixed versions.
      # Bump with `pnpm release <version>` before tagging.
      - name: Check tag matches every version manifest
        run: node scripts/versions.mjs check "$GITHUB_REF_NAME"

      - name: Get previous tag
        id: prev
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Get the tag before the current one
          PREV=$(git tag --sort=-version:refname | grep -vxF "$REF_NAME" | head -1)
          if [ -z "$PREV" ]; then
            # First tag ever — use the initial commit so everything builds
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "ref=$PREV" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.prev.outputs.ref }}
          filters: |
            api:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'Dockerfile'
              - 'Dockerfile.once'
              - 'docker-entrypoint.sh'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/api/src/index.ts'
            store:
              - 'apps/store/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - 'packages/cli/**'
              - 'packages/shared/**'
            mcp:
              - 'packages/mcp/**'
              - 'packages/shared/**'

  # ── Docker images (GHCR) ───────────────────────────────────────
  # Runs for EVERY release tag (no paths filter): a version always has images,
  # so `:vX.Y.Z` is never a dangling reference, and every image records the
  # exact source revision. Tags pushed per image (docker/metadata-action):
  #   v0.10.0  0.10.0  0.10  sha-<first 12 chars of the commit>  latest
  # A pre-release (v0.10.0-rc.1) gets only v0.10.0-rc.1, 0.10.0-rc.1 and
  # sha-<12>: never `latest` or the moving X.Y tag.
  docker:
    name: Docker Images
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signing (Sigstore OIDC) — this job only
    env:
      REF_NAME: ${{ github.ref_name }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      # sha-<12> tag (7 by default), and OCI annotations on both the
      # per-platform manifests and the multi-arch index (what registries show).
      DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    outputs:
      version: ${{ steps.rel.outputs.version }}
      api_image: ${{ steps.rel.outputs.api_image }}
      api_digest: ${{ steps.build_api.outputs.digest }}
      once_image: ${{ steps.rel.outputs.once_image }}
      once_digest: ${{ steps.build_once.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `version` is the tag without its leading v (baked into the image as
      # HISAABO_VERSION, the same form as package.json and the web UI). A "-"
      # in the version marks a pre-release (-beta.1, -rc.1), which never moves
      # `latest` or the X.Y tag. Image names must be lowercase.
      - name: Resolve release version and image names
        id: rel
        run: |
          OWNER="${IMAGE_OWNER,,}"
          if [[ "$REF_NAME" == *-* ]]; then
            echo "Pre-release ${REF_NAME}: not tagging latest or X.Y"
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "version=${REF_NAME#v}"
            echo "prerelease=${PRERELEASE}"
            echo "api_image=ghcr.io/${OWNER}/hisaabo-api"
            echo "once_image=ghcr.io/${OWNER}/hisaabo"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags are immutable: self-hosters pin `:vX.Y.Z` and expect the
      # same bytes forever. Fail BEFORE anything is pushed if either image
      # already has this version, unless a maintainer explicitly forces it
      # (workflow_dispatch input `force`, to recover a half-pushed release).
      # Only a clear "not found" counts as absent; any other failure (network,
      # registry error) fails closed, so a blip can never allow an overwrite.
      # ("denied" means the package does not exist yet, i.e. the first release
      # of an image; a genuine auth problem fails the push below instead.)
      - name: Refuse to overwrite an existing release tag
        env:
          API_IMAGE: ${{ steps.rel.outputs.api_image }}
          ONCE_IMAGE: ${{ steps.rel.outputs.once_image }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          existing=()
          for image in "$API_IMAGE" "$ONCE_IMAGE"; do
            ref="${image}:${REF_NAME}"
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              existing+=("$ref")
            elif grep -qiE 'not found|manifest unknown|name unknown|denied|unauthorized' <<<"$out"; then
              echo "${ref} does not exist yet"
            else
              echo "::error title=Cannot verify release tag::Could not determine whether ${ref} exists (failing closed): ${out}"
              exit 1
            fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            exit 0
          fi
          if [ "${FORCE:-}" = "true" ]; then
            echo "::warning title=Overwriting release tag::force=true: re-pushing ${existing[*]}. Digest pins stay valid; tag pins will move."
          else
            echo "::error title=Release image tag already exists::Already published: ${existing[*]}. Release images are immutable: cut a new version instead. To recover a partially failed release, run this workflow on the tag via workflow_dispatch with force=true."
            exit 1
          fi

      # labels and annotations are generated independently, so each override
      # appears in both. source/revision/created/url come from the workflow
      # context. The licence has no SPDX identifier, so it is stated explicitly
      # (instead of the generated NOASSERTION).
      - name: Image metadata (API)
        id: meta_api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.rel.outputs.api_image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rel.outputs.prerelease == 'false' }}
            type=sha
            type=raw,value=latest,enable=${{ steps.rel.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Hisaabo API
            org.opencontainers.image.description=Invoicing and business management API
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0
          annotations: |
            org.opencontainers.image.title=Hisaabo API
            org.opencontainers.image.description=Invoicing and business management API
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0

      - name: Build & push API image
        id: build_api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          annotations: ${{ steps.meta_api.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Sign API image (cosign, keyless)
        env:
          IMAGE: ${{ steps.rel.outputs.api_image }}
          DIGEST: ${{ steps.build_api.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Image metadata (ONCE)
        id: meta_once
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.rel.outputs.once_image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rel.outputs.prerelease == 'false' }}
            type=sha
            type=raw,value=latest,enable=${{ steps.rel.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Hisaabo
            org.opencontainers.image.description=Invoicing and business management — all-in-one (PostgreSQL + API)
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0
          annotations: |
            org.opencontainers.image.title=Hisaabo
            org.opencontainers.image.description=Invoicing and business management — all-in-one (PostgreSQL + API)
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0

      - name: Build & push ONCE image
        id: build_once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.once
          push: true
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta_once.outputs.tags }}
          labels: ${{ steps.meta_once.outputs.labels }}
          annotations: ${{ steps.meta_once.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=once
          cache-to: type=gha,mode=max,scope=once

      - name: Sign ONCE image (cosign, keyless)
        env:
          IMAGE: ${{ steps.rel.outputs.once_image }}
          DIGEST: ${{ steps.build_once.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # ── Web & Store deploy to Cloudflare Pages on push to main ─────
  # (handled by deploy-web.yml and deploy-store.yml — no need to duplicate here)

  # ── Desktop (Tauri — Windows, macOS, Linux) ────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        # Same pin as build-desktop.yml; tauri-action would otherwise fetch a
        # floating @tauri-apps/cli. The Rust cache may restore ~/.cargo/bin, so
        # reuse the binary only when it is exactly the pinned version.
        shell: bash
        env:
          TAURI_CLI_VERSION: "2.12.1"
        run: |
          if [ "$(cargo tauri --version 2>/dev/null)" = "tauri-cli ${TAURI_CLI_VERSION}" ]; then
            echo "Using cached tauri-cli ${TAURI_CLI_VERSION}"
          else
            cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked --force
          fi
          cargo tauri --version

      - name: Note optional Tauri updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice title=Tauri updater signing skipped::TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) are not set; the build proceeds without signed updater bundles. Add them as repository secrets to enable updater signing."
          fi

      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Source revision shown next to the version in the app (vite.config.ts
          # shortens it).
          VITE_APP_COMMIT: ${{ github.sha }}
          # Tauri updater-bundle signing key, supplied from repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          # Apply the production CSP overlay (strips localhost:3000 —
          # needed for `tauri dev` but dangerous in a signed release). See
          # apps/desktop/src-tauri/tauri.conf.prod.json.
          args: "--config src-tauri/tauri.conf.prod.json"
          tagName: ${{ github.ref_name }}
          releaseName: "Hisaabo ${{ github.ref_name }}"
          # No releaseBody on purpose: the release-notes job (which runs after
          # every build job) owns the body. A body set here ended up as the
          # published body of every release, because release-notes could not
          # replace it (see the "Publish release" step there). The release
          # stays a draft until release-notes publishes it.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── Mobile (Android APK via EAS) ───────────────────────────────
  mobile:
    name: Android APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Play Store / release signing is not set up yet. Without ALL four secrets
      # the signed release APK is skipped (never fall back to the debug keystore).
      - name: Check Android signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android release APK skipped::Android signing is not configured (missing: ${missing[*]}). The signed release APK build and upload are skipped; no debug-signed APK is published. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.signing.outputs.enabled == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.signing.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile
        if: steps.signing.outputs.enabled == 'true'

      - name: Expo prebuild
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      # Release APKs must be signed with the project's release keystore. Expo's
      # prebuilt Gradle project would otherwise fall back to the public debug
      # keystore, producing an APK anyone could re-sign. Required secrets:
      #   ANDROID_KEYSTORE_BASE64      base64 of the .jks/.keystore file
      #   ANDROID_KEYSTORE_PASSWORD    keystore password
      #   ANDROID_KEY_ALIAS            key alias
      #   ANDROID_KEY_PASSWORD         key password
      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Android release signing not configured::Missing repository secret(s): ${missing[*]}. A release APK must not be built with the debug keystore. Add the secrets (see comment above this step) and re-run."
            exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify APK is not debug-signed
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is signed with the Android debug key — refusing to publish."
            exit 1
          fi

      - name: Remove keystore
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv apps/mobile/android/app/build/outputs/apk/release/*.apk "apps/mobile/android/app/build/outputs/apk/release/hisaabo-${REF_NAME}.apk"

      - name: Upload APK to release
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: apps/mobile/android/app/build/outputs/apk/release/hisaabo-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}

  # ── CLI (npm publish) ──────────────────────────────────────────
  cli:
    name: Publish CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 ships with npm 11.x, which satisfies Trusted Publishing's
      # npm >= 11.5.1 requirement without a separate upgrade step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hisaabo/cli build

      # Publishes via npm Trusted Publishing (OIDC). Requires a Trusted
      # Publisher config on npmjs.org for @hisaabo/cli pointing at this
      # repo and workflow filename "release.yml". No NPM_TOKEN secret is
      # used. Provenance is auto-attached when OIDC publishing is
      # detected — do NOT pass --provenance explicitly.
      #
      # We pack with pnpm (resolves workspace: protocol into real
      # versions in the tarball's package.json) and then publish the
      # tarball with `npm publish` per npm's Trusted Publisher docs.
      - name: Publish @hisaabo/cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@hisaabo/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "⏭️  @hisaabo/cli@${VERSION} already published — skipping"
            exit 0
          fi
          pnpm -C packages/cli pack --pack-destination /tmp/cli
          npm publish /tmp/cli/*.tgz --access public

  # ── MCP (npm publish) ──────────────────────────────────────────
  mcp:
    name: Publish MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 ships with npm 11.x, which satisfies Trusted Publishing's
      # npm >= 11.5.1 requirement without a separate upgrade step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hisaabo/mcp build

      # Publishes via npm Trusted Publishing (OIDC). Requires a Trusted
      # Publisher config on npmjs.org for @hisaabo/mcp pointing at this
      # repo and workflow filename "release.yml". No NPM_TOKEN secret is
      # used. Provenance is auto-attached when OIDC publishing is
      # detected — do NOT pass --provenance explicitly.
      - name: Publish @hisaabo/mcp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@hisaabo/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "⏭️  @hisaabo/mcp@${VERSION} already published — skipping"
            exit 0
          fi
          pnpm -C packages/mcp pack --pack-destination /tmp/mcp
          npm publish /tmp/mcp/*.tgz --access public

  # ── Release Notes ──────────────────────────────────────────────
  release-notes:
    name: Publish Release Notes
    needs: [changes, docker, desktop, mobile, cli, mcp]
    # Not for a tag the version check rejected: nothing was built for it.
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          # The API image is rebuilt for every release tag, whatever changed.
          API: "true"
          WEB: ${{ needs.changes.outputs.web }}
          STORE: ${{ needs.changes.outputs.store }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          CLI: ${{ needs.changes.outputs.cli }}
          MCP: ${{ needs.changes.outputs.mcp }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          API_IMAGE: ${{ needs.docker.outputs.api_image }}
          API_DIGEST: ${{ needs.docker.outputs.api_digest }}
          ONCE_IMAGE: ${{ needs.docker.outputs.once_image }}
          ONCE_DIGEST: ${{ needs.docker.outputs.once_digest }}
          RELEASE_SHA: ${{ github.sha }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          MOBILE_PUBLISHED: ${{ needs.mobile.outputs.published }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Get commits since last tag
          PREV=$(git tag --sort=-version:refname | grep -vxF "$REF_NAME" | head -1)
          if [ -z "$PREV" ]; then
            COMMITS=$(git log --oneline -20)
          else
            COMMITS=$(git log --oneline "${PREV}..HEAD")
          fi

          cat > /tmp/release-body.md << 'HEADER'
          ## What's Updated

          HEADER

          status() {
            local changed=$1 result=$2 label=$3
            if [ "$changed" = "true" ]; then
              if [ "$result" = "success" ]; then echo "| $label | Updated | :white_check_mark: |"
              elif [ "$result" = "skipped" ]; then echo "| $label | Updated | :hourglass: Skipped |"
              else echo "| $label | Updated | :x: Build failed |"
              fi
            else
              echo "| $label | No changes | :heavy_minus_sign: |"
            fi
          }

          # The Android job succeeds but publishes nothing when signing secrets are absent.
          mobile_status() {
            if [ "$MOBILE" != "true" ]; then
              echo "| Android APK | No changes | :heavy_minus_sign: |"
            elif [ "$MOBILE_RESULT" = "success" ] && [ "$MOBILE_PUBLISHED" != "true" ]; then
              echo "| Android APK | Updated | :hourglass: Not published (signing not configured) |"
            else
              status "$MOBILE" "$MOBILE_RESULT" "Android APK"
            fi
          }

          web_status() {
            local changed=$1 label=$2
            if [ "$changed" = "true" ]; then
              echo "| $label | Updated (deploys on merge) | :white_check_mark: |"
            else
              echo "| $label | No changes | :heavy_minus_sign: |"
            fi
          }

          cat >> /tmp/release-body.md << EOF
          | Component | Status | Build |
          |---|---|---|
          $(status "$API" "$DOCKER_RESULT" "API (Docker)")
          $(web_status "$WEB" "Web App")
          $(web_status "$STORE" "Online Store")
          $(mobile_status)
          $(status "$DESKTOP" "$DESKTOP_RESULT" "Desktop (Win/Mac/Linux)")
          $(status "$CLI" "$CLI_RESULT" "CLI (@hisaabo/cli)")
          $(status "$MCP" "$MCP_RESULT" "MCP Server (@hisaabo/mcp)")
          EOF

          # Only describe images that were pushed AND signed: a tag that was
          # never built must not be advertised.
          if [ "$DOCKER_RESULT" = "success" ] && [ -n "$API_DIGEST" ] && [ -n "$ONCE_DIGEST" ]; then
            DOCKER_SIGNING="signed (cosign, keyless); verify the digest as shown above."
            cat >> /tmp/release-body.md << EOF

          ## Docker

          Built from commit \`${RELEASE_SHA}\` (also tagged \`sha-${RELEASE_SHA:0:12}\`). The version tag \`${REF_NAME}\` is published once and never overwritten; the digest pins the exact bytes.

          \`\`\`bash
          # API image
          docker pull ${API_IMAGE}:${REF_NAME}
          docker pull ${API_IMAGE}@${API_DIGEST}

          # All-in-one (ONCE) image
          docker pull ${ONCE_IMAGE}:${REF_NAME}
          docker pull ${ONCE_IMAGE}@${ONCE_DIGEST}
          \`\`\`

          Images are signed with cosign (keyless) and carry SLSA provenance and an SBOM. Verify by digest:

          \`\`\`bash
          cosign verify ${API_IMAGE}@${API_DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPOSITORY}/.github/workflows/release.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          cosign verify ${ONCE_IMAGE}@${ONCE_DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPOSITORY}/.github/workflows/release.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Each image records its source revision (\`org.opencontainers.image.revision\`), and the running API reports its version and commit in its startup log.
          EOF
          else
            DOCKER_SIGNING="not published for this release (the image build did not succeed)."
            cat >> /tmp/release-body.md << EOF

          ## Docker

          :x: No Docker images were published for ${REF_NAME} (the image build did not succeed), so there is nothing to pull for this version. See the table above.
          EOF
          fi

          cat >> /tmp/release-body.md << EOF

          ## Signing status

          - **Docker images:** ${DOCKER_SIGNING}
          - **Android APK:** published only when the project release keystore secrets are configured (signed with it); otherwise no APK is attached to the release. Debug-signed APKs are never published.
          - **Desktop installers (Windows/macOS/Linux):** **NOT code-signed or notarized.** No Apple Developer ID or Windows Authenticode certificate is configured, so Gatekeeper and SmartScreen will show warnings. Only install builds downloaded from this release page.

          ## Commits

          \`\`\`
          ${COMMITS}
          \`\`\`

          ---
          *Components marked "No changes" are unchanged from the previous release. Download those builds from the [latest release](https://github.com/hisaabo/hisaabo/releases) that includes them.*
          EOF

          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      # Publishes the release with the final notes, addressing it by id.
      # softprops/action-gh-release was not reliable here: the Tauri job leaves
      # a DRAFT release behind and the releases-by-tag API never returns drafts.
      # v2.6.2 (what `@v2` resolved to when v0.9.0 shipped) therefore did not see
      # it, created a second draft with these notes, then "canonicalised" to the
      # older Tauri draft, deleted its own and published the placeholder body,
      # so every release showed only the Tauri text. Listing releases and
      # patching the one for this tag does not depend on that behaviour.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          BODY_PATH: ${{ steps.notes.outputs.body_path }}
        run: |
          set -euo pipefail
          # A "-" in the version marks a pre-release (-beta.1, -rc.1): flagged
          # as such and never "Latest". Stable uses GitHub's own ordering.
          if [[ "$REF_NAME" == *-* ]]; then
            PRERELEASE=true
            MAKE_LATEST=false
          else
            PRERELEASE=false
            MAKE_LATEST=legacy
          fi

          matches=$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$REF_NAME" '.[] | select(.tag_name == $tag) | .id')
          count=$(printf '%s' "$matches" | grep -c . || true)

          if [ "$count" -gt 1 ]; then
            echo "::error title=Duplicate releases::Found ${count} releases for ${REF_NAME} (ids: $(tr '\n' ' ' <<<"$matches")). Parallel jobs probably each created a draft. Merge their assets into one release by hand, delete the others, and re-run this job."
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            args=(--repo "$REPOSITORY" --verify-tag --title "Hisaabo ${REF_NAME}" --notes-file "$BODY_PATH")
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease --latest=false); fi
            gh release create "$REF_NAME" "${args[@]}"
          else
            gh api --method PATCH "repos/${REPOSITORY}/releases/${matches}" \
              -f name="Hisaabo ${REF_NAME}" \
              -F body=@"$BODY_PATH" \
              -F draft=false \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$MAKE_LATEST" \
              --jq '"Published " + .html_url'
          fi
