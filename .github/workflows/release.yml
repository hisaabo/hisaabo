name: Release

# Order of a release (docs/DEPLOYMENT.md, "Release runbook"):
#   1. changes          the tag must match every version manifest
#   2. prepare-release  the ONE GitHub release for the tag (draft); every job
#                       below attaches to it by id and never creates another
#   3. docker           images built, pushed and cosign-signed (and the
#                       signatures verified)
#   4. wait-for-api     the production API runs on a separate server and is
#                       upgraded by the operator (HISAABO_API_IMAGE pinned to
#                       the new tag), so this job only POLLS
#                       <api>/api/version until it reports the tagged version
#   5. deploy-web / deploy-store / deploy-api-docs, and the CLI and MCP npm
#      publishes
#                       need wait-for-api; the Pages deploys run in the
#                       `production` environment, so its required reviewers
#                       approve here
#   6. release-notes    fills in and publishes the release
# Desktop and Android build in parallel with all of that and only attach assets
# to the release from step 2.
on:
  push:
    tags:
      - "v*"
  # Recovery only: re-run a release (on the tag ref; a branch fails the version
  # check). Releases are otherwise started by pushing the tag.
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite image tags that already exist for this version (recovery from a partial publish only; releases are otherwise immutable). Without it, a second run reuses the published images after re-verifying their signatures."
        type: boolean
        default: false
      skip_api_wait:
        description: "EMERGENCY ONLY: deploy web/store without waiting for the production API to report this version. Frontends then run against whatever API version is live."
        type: boolean
        default: false
      api_wait_timeout_minutes:
        description: "How long wait-for-api polls before it fails, in minutes. Empty uses the API_WAIT_TIMEOUT_MINUTES repository variable, else 350 (also the cap: GitHub stops a hosted job at 360). Tag pushes always use the variable."
        type: string
        default: ""

# Least privilege: read-only by default. Jobs that publish or sign request
# exactly the extra scopes they need (id-token for npm Trusted Publishing and
# cosign keyless signing, packages for GHCR, contents:write for release assets).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detect what changed since last tag ─────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      store: ${{ steps.filter.outputs.store }}
      api_docs: ${{ steps.filter.outputs.api_docs }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every deployed artifact reads its version from the committed manifests
      # (web/desktop UI and API from package.json, Tauri from tauri.conf.json,
      # Android from app.json, npm from the package). Refuse a tag that does
      # not match them all, so a release can never ship mixed versions.
      # Bump with `pnpm release <version>` before tagging.
      - name: Check tag matches every version manifest
        run: node scripts/versions.mjs check "$GITHUB_REF_NAME"

      - name: Get previous tag
        id: prev
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Get the tag before the current one
          PREV=$(git tag --sort=-version:refname | grep -vxF "$REF_NAME" | head -1)
          if [ -z "$PREV" ]; then
            # First tag ever — use the initial commit so everything builds
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "ref=$PREV" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.prev.outputs.ref }}
          filters: |
            api:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'apps/ops/**'
              - 'Dockerfile'
              - 'Dockerfile.once'
              - 'docker-entrypoint.sh'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/api/src/index.ts'
              - 'packages/api/src/router.ts'
              - 'packages/api/src/routers/**'
            store:
              - 'apps/store/**'
            api_docs:
              - 'apps/api-docs/**'
              - 'packages/api/src/index.ts'
              - 'packages/api/src/router.ts'
              - 'packages/api/src/routers/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - 'packages/cli/**'
              - 'packages/shared/**'
            mcp:
              - 'packages/mcp/**'
              - 'packages/shared/**'

  # ── The one GitHub release for this tag ────────────────────────
  # The ONLY job that creates a release. Desktop, Android and release-notes
  # attach to / edit it by id. Before this job the desktop matrix (3 parallel
  # jobs), the Android job and release-notes each created or looked up a draft
  # on their own, which raced into duplicates and, next to a hand-made
  # pre-release, failed the notes job for 0.10.0. An existing release for the
  # tag (draft or published) is reused; two or more fail here, early.
  prepare-release:
    name: Prepare GitHub Release
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the draft; list releases (drafts need write access)
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the draft release, or reuse the existing one
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ensure-release.sh "$REF_NAME"

  # ── Docker images (GHCR) ───────────────────────────────────────
  # Runs for EVERY release tag (no paths filter): a version always has images,
  # so `:vX.Y.Z` is never a dangling reference, and every image records the
  # exact source revision. Tags pushed per image (docker/metadata-action):
  #   v0.10.0  0.10.0  0.10  sha-<first 12 chars of the commit>  latest
  # A pre-release (v0.10.0-rc.1) gets only v0.10.0-rc.1, 0.10.0-rc.1 and
  # sha-<12>: never `latest` or the moving X.Y tag.
  #
  # Nothing is pushed unless prepare-release succeeded (images are immutable, so
  # do not publish into a release state that has to be fixed and re-run). This
  # job succeeding means BOTH images are pushed, signed and their signatures
  # verified: wait-for-api needs it, so the operator is only asked to upgrade to
  # an image that is complete.
  docker:
    name: Docker Images
    needs: [changes, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signing (Sigstore OIDC) — this job only
    env:
      REF_NAME: ${{ github.ref_name }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      # sha-<12> tag (7 by default), and OCI annotations on both the
      # per-platform manifests and the multi-arch index (what registries show).
      DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    outputs:
      version: ${{ steps.rel.outputs.version }}
      api_image: ${{ steps.rel.outputs.api_image }}
      # Freshly built, or (a second run on the tag) the digests of the images
      # that were already published.
      api_digest: ${{ steps.build_api.outputs.digest || steps.existing.outputs.api_digest }}
      once_image: ${{ steps.rel.outputs.once_image }}
      once_digest: ${{ steps.build_once.outputs.digest || steps.existing.outputs.once_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `version` is the tag without its leading v (baked into the image as
      # HISAABO_VERSION, the same form as package.json and the web UI). A "-"
      # in the version marks a pre-release (-beta.1, -rc.1), which never moves
      # `latest` or the X.Y tag. Image names must be lowercase.
      - name: Resolve release version and image names
        id: rel
        run: |
          OWNER="${IMAGE_OWNER,,}"
          if [[ "$REF_NAME" == *-* ]]; then
            echo "Pre-release ${REF_NAME}: not tagging latest or X.Y"
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "version=${REF_NAME#v}"
            echo "prerelease=${PRERELEASE}"
            echo "api_image=ghcr.io/${OWNER}/hisaabo-api"
            echo "once_image=ghcr.io/${OWNER}/hisaabo"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags are immutable: self-hosters pin `:vX.Y.Z` and expect the
      # same bytes forever. See scripts/check-existing-images.sh:
      #   neither image exists -> build, push and sign (below)
      #   BOTH exist, no force -> reuse: nothing is rebuilt or pushed; the
      #     existing signatures are verified and their digests flow on, so a
      #     second run on the same tag (Re-run all jobs, or a dispatch with
      #     skip_api_wait / api_wait_timeout_minutes) reaches wait-for-api
      #   one exists, no force -> fail (partial publish)
      #   force=true           -> re-push, loudly
      # `force` stays a separate, explicit act: it is never implied by a re-run.
      - name: Check for already-published release images
        id: existing
        env:
          API_IMAGE: ${{ steps.rel.outputs.api_image }}
          ONCE_IMAGE: ${{ steps.rel.outputs.once_image }}
          FORCE: ${{ inputs.force }}
        run: bash scripts/check-existing-images.sh

      # labels and annotations are generated independently, so each override
      # appears in both. source/revision/created/url come from the workflow
      # context. The licence has no SPDX identifier, so it is stated explicitly
      # (instead of the generated NOASSERTION).
      - name: Image metadata (API)
        id: meta_api
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.rel.outputs.api_image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rel.outputs.prerelease == 'false' }}
            type=sha
            type=raw,value=latest,enable=${{ steps.rel.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Hisaabo API
            org.opencontainers.image.description=Invoicing and business management API
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0
          annotations: |
            org.opencontainers.image.title=Hisaabo API
            org.opencontainers.image.description=Invoicing and business management API
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0

      - name: Build & push API image
        id: build_api
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          annotations: ${{ steps.meta_api.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Sign API image (cosign, keyless)
        if: steps.existing.outputs.reuse != 'true'
        env:
          IMAGE: ${{ steps.rel.outputs.api_image }}
          DIGEST: ${{ steps.build_api.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Image metadata (ONCE)
        id: meta_once
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.rel.outputs.once_image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rel.outputs.prerelease == 'false' }}
            type=sha
            type=raw,value=latest,enable=${{ steps.rel.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Hisaabo
            org.opencontainers.image.description=Invoicing and business management — all-in-one (PostgreSQL + API)
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0
          annotations: |
            org.opencontainers.image.title=Hisaabo
            org.opencontainers.image.description=Invoicing and business management — all-in-one (PostgreSQL + API)
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy-1.0

      - name: Build & push ONCE image
        id: build_once
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.once
          push: true
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta_once.outputs.tags }}
          labels: ${{ steps.meta_once.outputs.labels }}
          annotations: ${{ steps.meta_once.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=once
          cache-to: type=gha,mode=max,scope=once

      - name: Sign ONCE image (cosign, keyless)
        if: steps.existing.outputs.reuse != 'true'
        env:
          IMAGE: ${{ steps.rel.outputs.once_image }}
          DIGEST: ${{ steps.build_once.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The last step of the job, and the gate for wait-for-api: prove each
      # signature is verifiable, for the images built just now AND for ones a
      # previous run published (a reused image must be proven, not trusted). The
      # certificate must name this workflow, at this tag, run on this commit, so
      # an image from some other run or commit never passes. Retried because the
      # transparency-log entry can lag the signing by a moment.
      - name: Verify image signatures
        env:
          API_REF: ${{ steps.rel.outputs.api_image }}@${{ steps.build_api.outputs.digest || steps.existing.outputs.api_digest }}
          ONCE_REF: ${{ steps.rel.outputs.once_image }}@${{ steps.build_once.outputs.digest || steps.existing.outputs.once_digest }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          REUSED: ${{ steps.existing.outputs.reuse }}
        run: |
          set -uo pipefail
          for ref in "$API_REF" "$ONCE_REF"; do
            for attempt in 1 2 3 4; do
              if cosign verify "$ref" \
                --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/release.yml@refs/tags/${REF_NAME}$" \
                --certificate-github-workflow-sha "$RELEASE_SHA" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then
                echo "Signature verified: ${ref}"
                continue 2
              fi
              echo "Signature for ${ref} not verifiable yet (attempt ${attempt}/4)"
              sleep 10
            done
            if [ "$REUSED" = "true" ]; then
              echo "::error title=Existing image signature not verifiable::${ref} was published by an earlier run but has no signature from this workflow at ${REF_NAME} (${RELEASE_SHA}). Nothing was rebuilt. Repair it deliberately: run this workflow on the tag via workflow_dispatch with force=true."
            else
              echo "::error title=Image signature missing::${ref} is not verifiable with cosign. The API wait must not start for an unverifiable image."
            fi
            exit 1
          done

  # ── Hold until the production API runs this version ────────────
  # The API is NOT deployed by this workflow: it runs on a separate server
  # (Docker Compose behind nginx) whose operator pins HISAABO_API_IMAGE to the
  # new tag by hand. So this job only waits, polling the public GET /api/version
  # of the production API until it reports the tagged version. That keeps the
  # web and store frontends (built against the new API) from going live ahead of
  # it, which is what happened for 0.10.0.
  #
  # `needs: docker` (default success() semantics): it starts only after both
  # images are pushed, signed and verified, i.e. once the operator CAN upgrade.
  # What waits for it: the Cloudflare Pages deploys AND the CLI and MCP npm
  # publishes, which are API clients too (npm publishes cannot be undone, and a
  # CLI/MCP that calls procedures the production API lacks fails in users'
  # hands).
  #
  # This job ALWAYS runs once the images are done (no job-level `if:`), so its
  # result is meaningful to release-notes: `success` means the API question is
  # settled, one of three ways, reported in the `result` output:
  #   ready       production reports this version
  #   not_needed  nothing in this release (no frontend, npm package or API
  #               reference) has to wait for the API upgrade (WAIT_NEEDED)
  #   skipped     the operator ticked skip_api_wait: the job takes its loud
  #               bypass path and sets skipped_by_operator=true
  # A job-level `skipped` therefore only ever means an upstream job (the image
  # build) failed, never a deliberate skip, and the release stays a draft.
  # A manual redeploy or rollback goes through deploy-web.yml /
  # deploy-store.yml directly, where the API-version check applies instead.
  wait-for-api:
    name: Wait for production API
    needs: [changes, docker]
    runs-on: ubuntu-latest
    # 355 = the script's 350-minute poll cap + checkout/setup. GitHub stops a
    # hosted job at 360 minutes, so a longer wait is not possible in one job;
    # re-run the failed jobs after upgrading the API instead.
    timeout-minutes: 355
    permissions:
      contents: read
    outputs:
      result: ${{ steps.wait.outputs.result }}
      skipped_by_operator: ${{ steps.wait.outputs.skipped_by_operator }}
      observed_version: ${{ steps.wait.outputs.observed_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the production API to report this version
        id: wait
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          # Override for a fork or a second environment (repository variable).
          API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.hisaabo.in' }}
          TIMEOUT_MINUTES: ${{ inputs.api_wait_timeout_minutes || vars.API_WAIT_TIMEOUT_MINUTES || '350' }}
          SKIP_API_WAIT: ${{ inputs.skip_api_wait && 'true' || 'false' }}
          # Only the Pages deploys and the npm publishes wait for the API.
          WAIT_NEEDED: ${{ (needs.changes.outputs.web == 'true' || needs.changes.outputs.store == 'true' || needs.changes.outputs.api_docs == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.mcp == 'true') && 'true' || 'false' }}
          API_IMAGE: ${{ needs.docker.outputs.api_image }}
          API_DIGEST: ${{ needs.docker.outputs.api_digest }}
        run: bash scripts/wait-for-api-version.sh

  # ── Web, store & API docs → Cloudflare Pages production ────────
  # Production goes live only from a tag (pushes to main deploy previews, see
  # deploy-web.yml / deploy-store.yml / deploy-api-docs.yml), and only after
  # wait-for-api: the production API reports this version. Each deploy then runs
  # in the `production` environment, so its required reviewers approve it here.
  deploy-web:
    name: Deploy Web
    needs: [changes, wait-for-api]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      ref: ${{ github.ref_name }}
      # skip_api_wait also lifts the deploy-level API version check, or the
      # emergency bypass would be refused one step later.
      allow_api_mismatch: ${{ inputs.skip_api_wait == true }}
    secrets: inherit

  deploy-store:
    name: Deploy Store
    needs: [changes, wait-for-api]
    if: needs.changes.outputs.store == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-store.yml
    with:
      ref: ${{ github.ref_name }}
      # skip_api_wait also lifts the deploy-level API version check, or the
      # emergency bypass would be refused one step later.
      allow_api_mismatch: ${{ inputs.skip_api_wait == true }}
    secrets: inherit

  deploy-api-docs:
    name: Deploy API Docs
    needs: [changes, wait-for-api]
    if: needs.changes.outputs.api_docs == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-api-docs.yml
    with:
      ref: ${{ github.ref_name }}
      # skip_api_wait also lifts the deploy-level API version check, or the
      # emergency bypass would be refused one step later.
      allow_api_mismatch: ${{ inputs.skip_api_wait == true }}
    secrets: inherit

  # ── Desktop (Tauri — Windows, macOS, Linux) ────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [changes, prepare-release]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        # Same pin as build-desktop.yml; tauri-action would otherwise fetch a
        # floating @tauri-apps/cli. The Rust cache may restore ~/.cargo/bin, so
        # reuse the binary only when it is exactly the pinned version.
        shell: bash
        env:
          TAURI_CLI_VERSION: "2.12.1"
        run: |
          if [ "$(cargo tauri --version 2>/dev/null)" = "tauri-cli ${TAURI_CLI_VERSION}" ]; then
            echo "Using cached tauri-cli ${TAURI_CLI_VERSION}"
          else
            cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked --force
          fi
          cargo tauri --version

      - name: Note optional Tauri updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice title=Tauri updater signing skipped::TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) are not set; the build proceeds without signed updater bundles. Add them as repository secrets to enable updater signing."
          fi

      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Source revision shown next to the version in the app (vite.config.ts
          # shortens it).
          VITE_APP_COMMIT: ${{ github.sha }}
          # Tauri updater-bundle signing key, supplied from repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          # Apply the production CSP overlay (strips localhost:3000 —
          # needed for `tauri dev` but dangerous in a signed release). See
          # apps/desktop/src-tauri/tauri.conf.prod.json.
          args: "--config src-tauri/tauri.conf.prod.json"
          # Upload to the release prepare-release made (by id) instead of
          # tagName/releaseName: with a tag, each of the three parallel matrix
          # jobs looked for "its" draft and could create one, which raced into
          # duplicates. With a releaseId this action never creates a release,
          # sets no title/body/draft/prerelease flags, and the release-notes job
          # owns all of them (and publishes it after every build job).
          releaseId: ${{ needs.prepare-release.outputs.release_id }}

  # ── Mobile (Android APK via EAS) ───────────────────────────────
  mobile:
    name: Android APK
    needs: [changes, prepare-release]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.upload.outcome == 'success' }}
      signing: ${{ steps.signing.outputs.enabled == 'true' && 'release' || 'template-debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With ALL four secrets the APK is signed with the project's release key.
      # Until that key exists (it comes with Play Store registration), the APK is
      # built exactly as releases up to 0.9.0 were: signed with the Expo/React
      # Native template's debug key, so it installs over those earlier APKs. That
      # key is public (anyone can sign an APK with it), so the release notes say
      # which key signed it; switching to the release key later needs one
      # uninstall/reinstall.
      - name: Check Android signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android APK signed with the template debug key::Release signing is not configured (missing: ${missing[*]}). The APK is built as in releases up to 0.9.0, signed with the Expo template's debug key, so it installs over those. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets to sign with the release key."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      # Release APKs must be signed with the project's release keystore. Expo's
      # prebuilt Gradle project would otherwise fall back to the public debug
      # keystore, producing an APK anyone could re-sign. Required secrets:
      #   ANDROID_KEYSTORE_BASE64      base64 of the .jks/.keystore file
      #   ANDROID_KEYSTORE_PASSWORD    keystore password
      #   ANDROID_KEY_ALIAS            key alias
      #   ANDROID_KEY_PASSWORD         key password
      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Android release signing not configured::Missing repository secret(s): ${missing[*]}. A release APK must not be built with the debug keystore. Add the secrets (see comment above this step) and re-run."
            exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build APK (template debug key, as up to 0.9.0)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK is signed with the template debug key
        if: steps.signing.outputs.enabled != 'true'
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(printf '%s\n' apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -q "CN=Android Debug" || { echo "::error::Expected the template debug key (as in 0.9.0); got another signer. Refusing to publish an APK that cannot update earlier installs."; exit 1; }

      - name: Verify APK is not debug-signed
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(printf '%s\n' apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is signed with the Android debug key — refusing to publish."
            exit 1
          fi

      - name: Remove keystore
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv apps/mobile/android/app/build/outputs/apk/release/*.apk "apps/mobile/android/app/build/outputs/apk/release/hisaabo-${REF_NAME}.apk"

      # Attaches to the release prepare-release made; this job never creates
      # one (gh finds a draft by its pending tag, which the releases-by-tag API
      # cannot, and --clobber makes a re-run replace the asset instead of failing).
      - name: Upload APK to release
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" "apps/mobile/android/app/build/outputs/apk/release/hisaabo-${REF_NAME}.apk" --repo "$REPOSITORY" --clobber

  # ── CLI (npm publish) ──────────────────────────────────────────
  cli:
    name: Publish CLI
    needs: [changes, wait-for-api]
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 24 ships with npm 11.x, which satisfies Trusted Publishing's
      # npm >= 11.5.1 requirement without a separate upgrade step.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hisaabo/cli build

      # Publishes via npm Trusted Publishing (OIDC). Requires a Trusted
      # Publisher config on npmjs.org for @hisaabo/cli pointing at this
      # repo and workflow filename "release.yml". No NPM_TOKEN secret is
      # used. Provenance is auto-attached when OIDC publishing is
      # detected — do NOT pass --provenance explicitly.
      #
      # We pack with pnpm (resolves workspace: protocol into real
      # versions in the tarball's package.json) and then publish the
      # tarball with `npm publish` per npm's Trusted Publisher docs.
      - name: Publish @hisaabo/cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@hisaabo/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "⏭️  @hisaabo/cli@${VERSION} already published — skipping"
            exit 0
          fi
          pnpm -C packages/cli pack --pack-destination /tmp/cli
          npm publish /tmp/cli/*.tgz --access public

  # ── MCP (npm publish) ──────────────────────────────────────────
  mcp:
    name: Publish MCP
    needs: [changes, wait-for-api]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 24 ships with npm 11.x, which satisfies Trusted Publishing's
      # npm >= 11.5.1 requirement without a separate upgrade step.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hisaabo/mcp build

      # Publishes via npm Trusted Publishing (OIDC). Requires a Trusted
      # Publisher config on npmjs.org for @hisaabo/mcp pointing at this
      # repo and workflow filename "release.yml". No NPM_TOKEN secret is
      # used. Provenance is auto-attached when OIDC publishing is
      # detected — do NOT pass --provenance explicitly.
      - name: Publish @hisaabo/mcp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@hisaabo/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "⏭️  @hisaabo/mcp@${VERSION} already published — skipping"
            exit 0
          fi
          pnpm -C packages/mcp pack --pack-destination /tmp/mcp
          npm publish /tmp/mcp/*.tgz --access public

  # ── Release Notes ──────────────────────────────────────────────
  release-notes:
    name: Publish Release Notes
    needs: [changes, prepare-release, docker, wait-for-api, deploy-web, deploy-store, deploy-api-docs, desktop, mobile, cli, mcp]
    # Not for a tag the version check rejected (nothing was built for it), nor
    # when there is no prepared release to edit.
    if: always() && needs.changes.result == 'success' && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          # The API image is rebuilt for every release tag, whatever changed.
          API: "true"
          WEB: ${{ needs.changes.outputs.web }}
          STORE: ${{ needs.changes.outputs.store }}
          API_DOCS: ${{ needs.changes.outputs.api_docs }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          STORE_RESULT: ${{ needs.deploy-store.result }}
          API_DOCS_RESULT: ${{ needs.deploy-api-docs.result }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          CLI: ${{ needs.changes.outputs.cli }}
          MCP: ${{ needs.changes.outputs.mcp }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          WAIT_RESULT: ${{ needs.wait-for-api.result }}
          WAIT_OUTCOME: ${{ needs.wait-for-api.outputs.result }}
          WAIT_SKIPPED_BY_OPERATOR: ${{ needs.wait-for-api.outputs.skipped_by_operator }}
          API_IMAGE: ${{ needs.docker.outputs.api_image }}
          API_DIGEST: ${{ needs.docker.outputs.api_digest }}
          ONCE_IMAGE: ${{ needs.docker.outputs.once_image }}
          ONCE_DIGEST: ${{ needs.docker.outputs.once_digest }}
          RELEASE_SHA: ${{ github.sha }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          MOBILE_PUBLISHED: ${{ needs.mobile.outputs.published }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Get commits since last tag
          PREV=$(git tag --sort=-version:refname | grep -vxF "$REF_NAME" | head -1)
          if [ -z "$PREV" ]; then
            COMMITS=$(git log --oneline -20)
          else
            COMMITS=$(git log --oneline "${PREV}..HEAD")
          fi

          cat > /tmp/release-body.md << 'HEADER'
          ## What's Updated

          HEADER

          status() {
            local changed=$1 result=$2 label=$3
            if [ "$changed" = "true" ]; then
              if [ "$result" = "success" ]; then echo "| $label | Updated | :white_check_mark: |"
              elif [ "$result" = "skipped" ]; then echo "| $label | Updated | :hourglass: Skipped |"
              else echo "| $label | Updated | :x: Build failed |"
              fi
            else
              echo "| $label | No changes | :heavy_minus_sign: |"
            fi
          }

          # The Android job succeeds but publishes nothing when signing secrets are absent.
          mobile_status() {
            if [ "$MOBILE" != "true" ]; then
              echo "| Android APK | No changes | :heavy_minus_sign: |"
            elif [ "$MOBILE_RESULT" = "success" ] && [ "$MOBILE_PUBLISHED" != "true" ]; then
              echo "| Android APK | Updated | :hourglass: Not published (signing not configured) |"
            else
              status "$MOBILE" "$MOBILE_RESULT" "Android APK"
            fi
          }

          # Pages deploys: "Build failed" also covers a failed or rejected deploy.
          deploy_status() {
            local changed=$1 result=$2 label=$3
            if [ "$changed" = "true" ] && [ "$result" = "success" ]; then
              echo "| $label | Deployed to production | :white_check_mark: |"
            else
              status "$changed" "$result" "$label"
            fi
          }

          # The production API is upgraded by hand; wait-for-api polls
          # /api/version until it reports this release (or is told to skip).
          api_wait_status() {
            local label="API in production"
            if [ "$WAIT_RESULT" = "success" ] && [ "$WAIT_OUTCOME" = "skipped" ] && [ "$WAIT_SKIPPED_BY_OPERATOR" = "true" ]; then
              echo "| $label | Wait bypassed by the operator (skip_api_wait) | :warning: Version NOT verified |"
            elif [ "$WAIT_RESULT" = "success" ] && [ "$WAIT_OUTCOME" = "not_needed" ]; then
              echo "| $label | Not needed (no frontend or client changed) | :heavy_minus_sign: |"
            elif [ "$WAIT_RESULT" = "success" ] && [ "$WAIT_OUTCOME" = "ready" ]; then
              echo "| $label | Reports ${REF_NAME#v} | :white_check_mark: |"
            elif [ "$WAIT_RESULT" = "success" ]; then
              echo "| $label | Outcome not recorded | :hourglass: Release not published |"
            elif [ "$WAIT_RESULT" = "skipped" ]; then
              echo "| $label | Not checked: an earlier job did not succeed | :x: Release not published |"
            elif [ "$WAIT_RESULT" = "cancelled" ]; then
              echo "| $label | Check cancelled | :hourglass: Frontends not deployed, release not published |"
            else
              echo "| $label | Did not report ${REF_NAME#v} in time | :x: Frontends not deployed, release not published |"
            fi
          }

          cat >> /tmp/release-body.md << EOF
          | Component | Status | Build |
          |---|---|---|
          $(status "$API" "$DOCKER_RESULT" "API (Docker)")
          $(api_wait_status)
          $(deploy_status "$WEB" "$WEB_RESULT" "Web App")
          $(deploy_status "$STORE" "$STORE_RESULT" "Online Store")
          $(deploy_status "$API_DOCS" "$API_DOCS_RESULT" "API Docs")
          $(mobile_status)
          $(status "$DESKTOP" "$DESKTOP_RESULT" "Desktop (Win/Mac/Linux)")
          $(status "$CLI" "$CLI_RESULT" "CLI (@hisaabo/cli)")
          $(status "$MCP" "$MCP_RESULT" "MCP Server (@hisaabo/mcp)")
          EOF

          # Only describe images that were pushed AND signed: a tag that was
          # never built must not be advertised.
          if [ "$DOCKER_RESULT" = "success" ] && [ -n "$API_DIGEST" ] && [ -n "$ONCE_DIGEST" ]; then
            DOCKER_SIGNING="signed (cosign, keyless); verify the digest as shown above."
            cat >> /tmp/release-body.md << EOF

          ## Docker

          Built from commit \`${RELEASE_SHA}\` (also tagged \`sha-${RELEASE_SHA:0:12}\`). The version tag \`${REF_NAME}\` is published once and never overwritten; the digest pins the exact bytes.

          \`\`\`bash
          # API image
          docker pull ${API_IMAGE}:${REF_NAME}
          docker pull ${API_IMAGE}@${API_DIGEST}

          # All-in-one (ONCE) image
          docker pull ${ONCE_IMAGE}:${REF_NAME}
          docker pull ${ONCE_IMAGE}@${ONCE_DIGEST}
          \`\`\`

          Images are signed with cosign (keyless) and carry SLSA provenance and an SBOM. Verify by digest:

          \`\`\`bash
          cosign verify ${API_IMAGE}@${API_DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPOSITORY}/.github/workflows/release.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          cosign verify ${ONCE_IMAGE}@${ONCE_DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPOSITORY}/.github/workflows/release.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Each image records its source revision (\`org.opencontainers.image.revision\`), and the running API reports its version and commit in its startup log.
          EOF
          else
            DOCKER_SIGNING="not published for this release (the image build did not succeed)."
            cat >> /tmp/release-body.md << EOF

          ## Docker

          :x: No Docker images were published for ${REF_NAME} (the image build did not succeed), so there is nothing to pull for this version. See the table above.
          EOF
          fi

          cat >> /tmp/release-body.md << EOF

          ## Signing status

          - **Docker images:** ${DOCKER_SIGNING}
          - **Android APK:** published only when the project release keystore secrets are configured (signed with it); otherwise no APK is attached to the release. Debug-signed APKs are never published.
          - **Desktop installers (Windows/macOS/Linux):** **NOT code-signed or notarized.** No Apple Developer ID or Windows Authenticode certificate is configured, so Gatekeeper and SmartScreen will show warnings. Only install builds downloaded from this release page.

          ## Commits

          \`\`\`
          ${COMMITS}
          \`\`\`

          ---
          *Components marked "No changes" are unchanged from the previous release. Download those builds from the [latest release](https://github.com/hisaabo/hisaabo/releases) that includes them.*
          EOF

          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      # Updates the release prepare-release made (draft, or a hand-made one it
      # reused) with the final notes and publishes it only when wait-for-api RAN
      # and succeeded (production reports the version, nothing needed the wait,
      # or the operator deliberately skipped it: scripts/publish-release.sh).
      # After a failed or timed-out wait, or when an upstream job such as the
      # image build failed (wait-for-api then shows as skipped), the notes are
      # updated but the release stays a draft, so the installers do not go public
      # with no matching API; a re-run of the failed jobs publishes it. It never creates
      # a release: it patches by id, so a re-run is idempotent. (Why not
      # softprops/action-gh-release: the releases-by-tag API never returns
      # drafts, so v2.6.2 did not see the Tauri draft, made a second one and
      # published the placeholder body for v0.9.0.)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          BODY_PATH: ${{ steps.notes.outputs.body_path }}
          WAIT_RESULT: ${{ needs.wait-for-api.result }}
          WAIT_OUTCOME: ${{ needs.wait-for-api.outputs.result }}
          WAIT_SKIPPED_BY_OPERATOR: ${{ needs.wait-for-api.outputs.skipped_by_operator }}
        run: bash scripts/publish-release.sh
