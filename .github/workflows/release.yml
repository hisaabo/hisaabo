name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detect what changed since last tag ─────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      store: ${{ steps.filter.outputs.store }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          PREV=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREV" ] || [ "$PREV" = "${{ github.ref_name }}" ]; then
            # First tag — build everything
            echo "ref=HEAD~50" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$PREV" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev.outputs.ref }}
          filters: |
            api:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'Dockerfile'
              - 'Dockerfile.once'
              - 'docker-entrypoint.sh'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/api/src/index.ts'
            store:
              - 'apps/store/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - 'packages/cli/**'
              - 'packages/shared/**'
            mcp:
              - 'packages/mcp/**'
              - 'packages/shared/**'

  # ── Docker images (GHCR) ───────────────────────────────────────
  docker:
    name: Docker Images
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hisaabo-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hisaabo-api:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push ONCE image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.once
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hisaabo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hisaabo:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=once
          cache-to: type=gha,mode=max,scope=once

  # ── Web SPA (Cloudflare Pages) ─────────────────────────────────
  web:
    name: Deploy Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hisaabo/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=hisaabo-web --commit-hash=${{ github.sha }}

  # ── Store SPA (Cloudflare Pages) ───────────────────────────────
  store:
    name: Deploy Store
    needs: changes
    if: needs.changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hisaabo/store build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/store/dist --project-name=hisaabo-store --commit-hash=${{ github.sha }}

  # ── Desktop (Tauri — Windows, macOS, Linux) ────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Hisaabo ${{ github.ref_name }}"
          releaseBody: "See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false

  # ── Mobile (Android APK via EAS) ───────────────────────────────
  mobile:
    name: Android APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}

  # ── CLI (npm publish) ──────────────────────────────────────────
  cli:
    name: Publish CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hisaabo/cli build

      - name: Set version from tag
        working-directory: packages/cli
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - run: pnpm --filter @hisaabo/cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── MCP (npm publish) ──────────────────────────────────────────
  mcp:
    name: Publish MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hisaabo/mcp build

      - name: Set version from tag
        working-directory: packages/mcp
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - run: pnpm --filter @hisaabo/mcp publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
