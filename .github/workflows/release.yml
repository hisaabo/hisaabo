name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detect what changed since last tag ─────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          # Get the tag before the current one
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -z "$PREV" ]; then
            # First tag ever — use the initial commit so everything builds
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "ref=$PREV" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev.outputs.ref }}
          filters: |
            api:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'Dockerfile'
              - 'Dockerfile.once'
              - 'docker-entrypoint.sh'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/api/src/index.ts'
            store:
              - 'apps/store/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - 'packages/cli/**'
              - 'packages/shared/**'
            mcp:
              - 'packages/mcp/**'
              - 'packages/shared/**'

  # ── Docker images (GHCR) ───────────────────────────────────────
  docker:
    name: Docker Images
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hisaabo-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hisaabo-api:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push ONCE image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.once
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hisaabo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hisaabo:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=once
          cache-to: type=gha,mode=max,scope=once

  # ── Web & Store deploy to Cloudflare Pages on push to main ─────
  # (handled by deploy-web.yml and deploy-store.yml — no need to duplicate here)

  # ── Desktop (Tauri — Windows, macOS, Linux) ────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Hisaabo ${{ github.ref_name }}"
          releaseBody: "Desktop builds for ${{ github.ref_name }}. See the [release notes](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) for details."
          releaseDraft: true
          prerelease: false

  # ── Mobile (Android APK via EAS) ───────────────────────────────
  mobile:
    name: Android APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}

  # ── CLI (npm publish) ──────────────────────────────────────────
  cli:
    name: Publish CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli && npm version "$VERSION" --no-git-tag-version

      - run: pnpm --filter @hisaabo/cli build
      - run: pnpm --filter @hisaabo/cli publish --no-git-checks --access public --provenance

  # ── MCP (npm publish) ──────────────────────────────────────────
  mcp:
    name: Publish MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/mcp && npm version "$VERSION" --no-git-tag-version

      - run: pnpm --filter @hisaabo/mcp build
      - run: pnpm --filter @hisaabo/mcp publish --no-git-checks --access public --provenance

  # ── Release Notes ──────────────────────────────────────────────
  release-notes:
    name: Publish Release Notes
    needs: [changes, docker, desktop, mobile, cli, mcp]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          API: ${{ needs.changes.outputs.api }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          CLI: ${{ needs.changes.outputs.cli }}
          MCP: ${{ needs.changes.outputs.mcp }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
        run: |
          # Get commits since last tag
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -z "$PREV" ]; then
            COMMITS=$(git log --oneline -20)
          else
            COMMITS=$(git log --oneline "${PREV}..HEAD")
          fi

          cat > /tmp/release-body.md << 'HEADER'
          ## What's Updated

          HEADER

          status() {
            local changed=$1 result=$2 label=$3
            if [ "$changed" = "true" ]; then
              if [ "$result" = "success" ]; then echo "| $label | Updated | :white_check_mark: |"
              elif [ "$result" = "skipped" ]; then echo "| $label | Updated | :hourglass: Skipped |"
              else echo "| $label | Updated | :x: Build failed |"
              fi
            else
              echo "| $label | No changes | :heavy_minus_sign: |"
            fi
          }

          cat >> /tmp/release-body.md << EOF
          | Component | Status | Build |
          |---|---|---|
          $(status "$API" "$DOCKER_RESULT" "API (Docker)")
          | Web App | Deployed on merge | :white_check_mark: |
          | Online Store | Deployed on merge | :white_check_mark: |
          $(status "$MOBILE" "$MOBILE_RESULT" "Android APK")
          $(status "$DESKTOP" "$DESKTOP_RESULT" "Desktop (Win/Mac/Linux)")
          $(status "$CLI" "$CLI_RESULT" "CLI (@hisaabo/cli)")
          $(status "$MCP" "$MCP_RESULT" "MCP Server (@hisaabo/mcp)")

          ## Docker

          \`\`\`bash
          docker pull ghcr.io/hisaabo/hisaabo:${{ github.ref_name }}
          \`\`\`

          ## Commits

          \`\`\`
          ${COMMITS}
          \`\`\`

          ---
          *Components marked "No changes" are unchanged from the previous release. Download those builds from the [latest release](https://github.com/hisaabo/hisaabo/releases) that includes them.*
          EOF

          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Hisaabo ${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
