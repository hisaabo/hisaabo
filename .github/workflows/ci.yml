name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Version manifests in lockstep
        run: pnpm versions:check

      - name: Lint
        run: pnpm exec oxlint --deny-warnings --ignore-path .gitignore --ignore-pattern '**/target/**' ./packages ./apps

  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency licenses
        run: pnpm licenses:check

  ownership-scoping:
    name: Ownership Scoping (IDOR)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tsx
        run: npm install -g tsx

      # Fails when a tRPC procedure accepts a client-supplied identifier but its
      # handler never scopes by ctx.businessId / ctx.tenantId (a likely
      # cross-tenant IDOR). Genuine exceptions live in
      # scripts/ownership-scoping-allowlist.json.
      - name: Check ownership scoping
        run: tsx scripts/check-ownership-scoping.ts --scan

  # The release gates run only on a tag, so their scripts are exercised here
  # against a fake API and a fake `gh`: the production API wait (scripts/
  # wait-for-api-version.sh), the one-release-per-tag helpers and the
  # release-exists guard in scripts/release-tag.sh. release-workflow.test.ts
  # pins the ordering invariants of the workflows themselves (frontends need
  # wait-for-api, production only from a tag, one job creates the release).
  release-scripts:
    name: Release Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_TS: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # --experimental-strip-types needs Node >= 22.6
          node-version: 22

      - name: Test the release scripts
        run: $NODE_TS --test scripts/wait-for-api-version.test.ts scripts/release-scripts.test.ts scripts/release-workflow.test.ts

  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_TS: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # --experimental-strip-types needs Node >= 22.6
          node-version: 22

      - name: Test migration checker
        run: $NODE_TS --test scripts/check-migrations.test.ts

      # Fails when a new migration would break the previous app version while
      # both run during a rollout (drop, rename, type change, NOT NULL without a
      # default, index/constraint on an existing table) or an applied migration
      # was edited. Intentional exceptions carry a `-- migration-lint-allow`
      # marker; see scripts/check-migrations.ts.
      - name: Check new migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: $NODE_TS scripts/check-migrations.ts --base "$BASE_SHA"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hisaabo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d hisaabo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/hisaabo_test
      DATABASE_URL: postgresql://test:test@localhost:5433/hisaabo_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema to test DB
        run: pnpm db:push

      - name: Run tests with coverage
        run: pnpm exec turbo test --concurrency 1 -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # Skipped when CODECOV_TOKEN is not available (unset, or fork PRs).
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/api/coverage/lcov.info
          fail_ci_if_error: false

  # Everything about dates is on the business calendar (IST, no daylight saving), so no result may depend
  # on the zone of the machine. The jobs above run in UTC (the default of every runner, and of the shipped
  # images). This one runs the date-sensitive suites under two other server zones, one with the offset of
  # the business (Asia/Kolkata) and one with DST (America/Los_Angeles: 8 Mar and 1 Nov 2026 are the
  # edges the DST tests use), and puts the DATABASE session in the same zone, so SQL that leans on the
  # session zone (date_trunc, ::date, to_char) is caught too. node-postgres-style PGTZ is not read by
  # the postgres.js driver the API uses, so the zone is set on the database itself.
  # Subset on a pull request (a few minutes, in parallel); the whole API suite on a push to main.
  time-zones:
    name: Time zones (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck-lint
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Kolkata, America/Los_Angeles]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hisaabo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d hisaabo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data

    env:
      TZ: ${{ matrix.tz }}
      PGTZ: ${{ matrix.tz }}
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/hisaabo_test
      DATABASE_URL: postgresql://test:test@localhost:5433/hisaabo_test
      # one worker: a worker database is cloned from the template and would not carry its session zone
      API_TEST_WORKERS: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema to test DB
        run: pnpm db:push

      - name: Put the database session in the same time zone
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -p 5433 -U test -d hisaabo_test -c "ALTER DATABASE hisaabo_test SET timezone TO '${{ matrix.tz }}'"
          psql -h localhost -p 5433 -U test -d hisaabo_test -Atc "SELECT 'new sessions run in ' || current_setting('TimeZone')"

      - name: Shared (business calendar, DST edges, state and UQC tables)
        run: pnpm --filter @hisaabo/shared exec vitest run

      - name: Web date helpers and date pickers
        run: pnpm --filter @hisaabo/web exec vitest run src/hooks src/lib src/components/ui src/components/settings

      - name: Mobile date helpers (picked days across DST edges)
        run: pnpm --filter @hisaabo/mobile exec jest src/lib

      - name: CLI and MCP date arguments
        run: |
          pnpm --filter @hisaabo/cli test
          pnpm --filter @hisaabo/mcp exec vitest run

      # The golden suites (dates, GST months, recurring, GSTR-1 JSON, CMP-08, intra / inter-state) and the unit
      # and integration tests that touch a date.
      - name: API date-sensitive suites
        run: >-
          pnpm --filter @hisaabo/api exec vitest run
          src/__tests__/integration/golden
          src/__tests__/integration/recurring-invoice
          src/__tests__/integration/dashboard
          src/__tests__/integration/gst
          src/__tests__/integration/itc
          src/__tests__/integration/reports
          src/__tests__/integration/tally-export
          src/__tests__/gst
          src/__tests__/uqc-maps
          src/__tests__/import-dates-ist
          src/__tests__/invoice-to
          src/__tests__/invoice-pdf-same-state
          src/__tests__/tally-xml-export
          src/__tests__/tds-sections

      - name: Whole API suite (push to main)
        if: github.event_name == 'push'
        run: pnpm --filter @hisaabo/api exec vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck-lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hisaabo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d hisaabo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/hisaabo_test
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Push schema to test DB
        run: pnpm db:push

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  # Browser tests for the public storefront (apps/store/e2e). The API is served
  # from fixtures (apps/store/e2e/mockStore.ts) and the Vite dev server is
  # started by Playwright itself, so this job needs no database and no API.
  # It does not set STORE_SHOTS_DIR: the screenshot-capture spec skips itself.
  store-e2e:
    name: Store E2E (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck-lint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @hisaabo/store exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The browser download is the slow part. Keyed on the Playwright version,
      # so a version bump fetches a fresh one.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @hisaabo/store exec playwright install --with-deps chromium

      # The cache holds the browser, not the OS libraries it needs.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @hisaabo/store exec playwright install-deps chromium

      - name: Run store E2E tests
        run: pnpm --filter @hisaabo/store test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-playwright-traces
          path: apps/store/e2e/.results/
          retention-days: 7

  # Both release images are built (single-arch, no push) so a Dockerfile or
  # Dockerfile.once break is caught on the PR, not at release time. Same
  # build-args as release.yml, plus a check that the version/revision plumbing
  # (ENV + OCI label) actually lands in the image.
  docker-build:
    name: Docker Build (dry run, ${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-lint
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: Dockerfile
          - image: once
            file: Dockerfile.once
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          build-args: |
            VERSION=0.0.0-ci
            GIT_SHA=${{ github.sha }}
          tags: hisaabo-${{ matrix.image }}:test

      - name: Check version and revision are baked in
        env:
          IMAGE: hisaabo-${{ matrix.image }}:test
        run: |
          env_lines=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE")
          grep -qx "HISAABO_VERSION=0.0.0-ci" <<<"$env_lines"
          grep -qx "HISAABO_COMMIT=${GITHUB_SHA}" <<<"$env_lines"
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
          test "$revision" = "$GITHUB_SHA"
