name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build method: eas (cloud) or local (self-hosted Gradle)"
        required: true
        default: local
        type: choice
        options:
          - eas
          - local
      profile:
        description: "EAS build profile (only used when build_type=eas)"
        required: false
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
  # EAS cloud builds disabled — no EXPO_TOKEN configured yet.
  # Re-enable this trigger once an Expo account is set up:
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/mobile/**"
  #     - "packages/shared/**"

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── EAS cloud build ───────────────────────────────────────────────────────
  # Delegates compilation to Expo's managed build infrastructure.
  # Requires EXPO_TOKEN secret set in repository settings.
  # Set build_type=eas (default) for cloud builds.
  build-eas:
    name: EAS Cloud Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'eas'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install EAS CLI
        run: npm install -g eas-cli@24.11.0

      - name: Trigger EAS build (no-wait)
        # --no-wait submits the build and exits immediately.
        # The build runs asynchronously on Expo's servers.
        # Monitor at https://expo.dev/accounts/<owner>/projects/hisaabo/builds
        run: >
          eas build
          --platform android
          --profile ${{ github.event.inputs.profile || 'preview' }}
          --non-interactive
          --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ── Local Gradle build ────────────────────────────────────────────────────
  # Runs the full Android build on a GitHub-hosted runner with the Android SDK.
  # Produces an APK artifact downloadable from the workflow run.
  # Trigger via workflow_dispatch with build_type=local.
  build-local:
    name: Local Gradle Build (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_type == 'local'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hisaabo-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
