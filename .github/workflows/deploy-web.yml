name: Deploy Web

# Production goes live only from a release tag: release.yml calls this
# workflow for a v* tag, and a manual run redeploys any tag (rollback).
# Pushes to main deploy a preview to the `preview` branch alias
# (preview.hisaabo-web.pages.dev), and only when the repository variable
# PREVIEW_API_URL points at a staging API, so unreleased web code never runs
# against the production API.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/api/src/index.ts" # AppRouter type export
      - "packages/api/src/router.ts"
      - "packages/api/src/routers/**"
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy to production
        required: true
        type: string
      allow_api_mismatch:
        description: "Deploy even if the production API does not report this version: an intentional rollback, or an emergency. Logged loudly."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy to production (e.g. v0.9.1)
        required: true
        type: string
      allow_api_mismatch:
        description: "Deploy even if the production API does not report this version: an intentional rollback, or an emergency. Logged loudly."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ inputs.ref && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages (${{ inputs.ref && 'production' || 'preview' }})
    if: inputs.ref || vars.PREVIEW_API_URL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A release (release.yml) reaches this job only after its wait-for-api job
    # saw the production API report the same version. Required reviewers on the
    # `production` environment (repo settings) are the second gate, and the
    # version is checked once more after their approval (a stale approval, or an
    # older tag approved after a newer release, is refused). A manual run
    # (redeploy / rollback) gets the same check; allow_api_mismatch bypasses it.
    environment: ${{ inputs.ref && 'production' || 'preview' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check the ref is a release tag
        if: inputs.ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Production deploys take a release tag (vX.Y.Z), got '$REF'"
            exit 1
          fi

      # The deploy's own commit carries the check script, even when the tag
      # being deployed (a rollback) predates it. These steps run AFTER the
      # `production` environment approval, so an approval that sat for days, an
      # API upgrade or rollback in between, or an older tag approved after a
      # newer release, is caught here. The production API must report exactly
      # this version; allow_api_mismatch bypasses it, loudly.
      - name: Fetch the API version check
        if: inputs.ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools
          sparse-checkout: scripts/wait-for-api-version.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the production API runs this release
        if: inputs.ref
        env:
          MODE: check
          EXPECTED_VERSION: ${{ inputs.ref }}
          API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.hisaabo.in' }}
          SKIP_API_WAIT: ${{ inputs.allow_api_mismatch && 'true' || 'false' }}
          OVERRIDE_NAME: allow_api_mismatch
        run: |
          trap 'rm -rf .release-tools' EXIT
          bash .release-tools/scripts/wait-for-api-version.sh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @hisaabo/web build
        env:
          VITE_API_URL: ${{ inputs.ref && secrets.VITE_API_URL || vars.PREVIEW_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Shown next to the version in the sidebar (vite.config.ts shortens it).
          VITE_APP_COMMIT: ${{ github.sha }}
          # Public values (repository variables, not secrets) for the generated
          # .well-known app-link files; placeholders are emitted until they are set.
          VITE_ANDROID_APP_CERT_SHA256: ${{ vars.VITE_ANDROID_APP_CERT_SHA256 }}
          VITE_APPLE_TEAM_ID: ${{ vars.VITE_APPLE_TEAM_ID }}
          # Chrome/Edge origin-trial token that enables WebMCP (document.modelContext)
          # on the deployed origin. Public by design (it ships in the page HTML), so a
          # repository variable, not a secret. Unset or empty keeps today's behaviour:
          # vite.config.ts then emits no origin-trial meta tag. Tokens are bound to one
          # origin: to avoid shipping the production token to the preview alias, define
          # the variable on the `production` environment instead of the repository.
          VITE_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.VITE_WEBMCP_ORIGIN_TRIAL_TOKEN }}

      # --branch picks the Pages environment: the project's production branch
      # (CF_PAGES_PRODUCTION_BRANCH, default main) is production, anything
      # else is a preview alias.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=hisaabo-web --branch=${{ inputs.ref && (vars.CF_PAGES_PRODUCTION_BRANCH || 'main') || 'preview' }}
          packageManager: npm
