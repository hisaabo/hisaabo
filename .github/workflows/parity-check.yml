name: Feature Parity Check

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/api/**"
      - "packages/cli/**"
      - "packages/mcp/**"
      - "parity-exceptions.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  parity-check:
    name: Check Feature Parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tsx
        run: npm install -g tsx

      - name: Get changed files
        id: changed
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > /tmp/changed-files.txt
          FILES=$(cat /tmp/changed-files.txt | tr '\n' ' ')

          echo "touches_api=$(grep -c 'packages/api/src/routers/' /tmp/changed-files.txt || true)" >> $GITHUB_OUTPUT
          echo "touches_web=$(grep -c 'apps/web/' /tmp/changed-files.txt || true)" >> $GITHUB_OUTPUT
          echo "touches_mobile=$(grep -c 'apps/mobile/' /tmp/changed-files.txt || true)" >> $GITHUB_OUTPUT
          echo "touches_exceptions=$(grep -c 'parity-exceptions.yaml' /tmp/changed-files.txt || true)" >> $GITHUB_OUTPUT

      - name: Validate exceptions file
        id: validate
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/check-parity.ts --validate 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Scan tRPC coverage
        id: scan
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/check-parity.ts --scan 2>&1)
          SCAN_EXIT=$?
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$SCAN_EXIT" >> $GITHUB_OUTPUT

      - name: Check changed files for parity gaps
        id: changed_check
        run: |
          set +e
          # Read files from temp file to avoid bash issues with parentheses in Expo paths
          OUTPUT=$(xargs npx tsx scripts/check-parity.ts --changed < /tmp/changed-files.txt 2>&1)
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate report
        id: report
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/check-parity.ts --report 2>&1)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const validateOutput = `${{ steps.validate.outputs.output }}`.trim();
            const scanOutput = `${{ steps.scan.outputs.output }}`.trim();
            const changedOutput = `${{ steps.changed_check.outputs.output }}`.trim();
            const hasGaps = '${{ steps.scan.outputs.exit_code }}' === '1';

            const touchesApi = '${{ steps.changed.outputs.touches_api }}' !== '0';
            const touchesWeb = '${{ steps.changed.outputs.touches_web }}' !== '0';
            const touchesMobile = '${{ steps.changed.outputs.touches_mobile }}' !== '0';
            const touchesExceptions = '${{ steps.changed.outputs.touches_exceptions }}' !== '0';

            let body = `## Feature Parity Report\n\n`;

            const areas = [];
            if (touchesApi) areas.push('API');
            if (touchesWeb) areas.push('Web');
            if (touchesMobile) areas.push('Mobile');
            if (touchesExceptions) areas.push('Exceptions');
            body += `**PR touches**: ${areas.join(', ') || 'None of the tracked areas'}\n\n`;

            if (hasGaps) {
              body += `> **PARITY GAPS FOUND** — web procedures exist that mobile does not implement and are not in \`parity-exceptions.yaml\`. See scan output below.\n\n`;
            }

            if (changedOutput && !changedOutput.includes('No parity gaps')) {
              body += `### Changed-File Parity Check\n\n\`\`\`\n${changedOutput}\n\`\`\`\n\n`;
            }

            // Validation summary line
            const validateLines = validateOutput.split('\n');
            const summaryLine = validateLines.find(l => l.includes('Summary:'));
            if (summaryLine) {
              body += `### Exceptions Validation\n\n${summaryLine.trim()}\n\n`;
            }

            // Scan: show parity percentage lines
            const scanLines = scanOutput.split('\n');
            const parityLines = scanLines.filter(l => l.includes('parity'));
            if (parityLines.length > 0) {
              body += `### tRPC Coverage\n\n${parityLines.join('\n').trim()}\n\n`;
            }

            body += `<details>\n<summary>Full scan output</summary>\n\n\`\`\`\n${scanOutput}\n\`\`\`\n\n</details>\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Feature Parity Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if validation errors
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

      - name: Fail if parity gaps found
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
