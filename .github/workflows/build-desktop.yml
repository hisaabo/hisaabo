name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/shared/**"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: hisaabo-linux
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            artifact_name: hisaabo-macos
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact_name: hisaabo-windows
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: rust-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @hisaabo/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Install Tauri CLI
        # Pinned (never a floating ^2): a compromised or breaking tauri-cli
        # release must not flow silently into signed-release builds.
        # The Rust cache restores ~/.cargo/bin without cargo's install
        # metadata, so a plain `cargo install` refuses to overwrite the cached
        # binary. Reuse it only when it is exactly the pinned version;
        # otherwise reinstall the pinned version over it.
        shell: bash
        env:
          TAURI_CLI_VERSION: "2.12.1"
        run: |
          if [ "$(cargo tauri --version 2>/dev/null)" = "tauri-cli ${TAURI_CLI_VERSION}" ]; then
            echo "Using cached tauri-cli ${TAURI_CLI_VERSION}"
          else
            cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked --force
          fi
          cargo tauri --version

      - name: Note optional Tauri updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice title=Tauri updater signing skipped::TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) are not set; the build proceeds without signed updater bundles. Add them as repository secrets to enable updater signing."
          fi

      - name: Build Tauri desktop app
        # Merge the prod config overlay on top of the base `tauri.conf.json`.
        # The overlay strips `http://localhost:3000` from the CSP connect-src
        # (present in the base for `tauri dev`); shipping it in a signed
        # production bundle would let a MITM on an open network redirect the
        # desktop app at a local attacker server. See P2 #4 in the security
        # review.
        run: cargo tauri build --config src-tauri/tauri.conf.prod.json
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Tauri updater-bundle signing key (from repository secrets). OS-level
          # code signing / notarization (Apple Developer ID, Windows Authenticode)
          # is NOT configured: installers produced here are unsigned and will
          # trigger Gatekeeper / SmartScreen warnings.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn
          retention-days: 30
