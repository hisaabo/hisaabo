name: Deploy API Docs

# Production goes live only from a release tag: release.yml calls this
# workflow for a v* tag, and a manual run redeploys any tag (rollback).
# Pushes to main deploy a preview to the `preview` branch alias
# (preview.hisaabo-api-docs.pages.dev).

on:
  push:
    branches: [main]
    paths:
      - "apps/api-docs/**"
      - "packages/api/src/index.ts"
      - "packages/api/src/router.ts"
      - "packages/api/src/routers/**"
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy to production
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy to production (e.g. v0.9.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-api-docs-${{ inputs.ref && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy API Docs to Cloudflare Pages (${{ inputs.ref && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.ref && 'production' || 'preview' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check the ref is a release tag
        if: inputs.ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Production deploys take a release tag (vX.Y.Z), got '$REF'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API docs
        run: pnpm --filter @hisaabo/api-docs build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/api-docs/dist --project-name=hisaabo-api-docs --branch=${{ inputs.ref && (vars.CF_PAGES_PRODUCTION_BRANCH || 'main') || 'preview' }}
          packageManager: npm
