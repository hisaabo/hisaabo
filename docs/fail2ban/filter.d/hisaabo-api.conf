# /etc/fail2ban/filter.d/hisaabo-api.conf
#
# Matches Hisaabo API security events emitted as pino JSON on stdout.
# See docs/fail2ban/README.md and packages/api/src/lib/logger.ts.
#
# The line shape (single line, fields may appear in any order in theory
# but pino preserves insertion order, so this regex assumes event-before-ip):
#
#   {"level":40,"time":...,"sec":true,"event":"<event>","ip":"<ip>",...}
#
# journald wraps the line in its own envelope; with `--output cat` the
# original message is restored, which is what fail2ban's systemd backend
# feeds the failregex.

[INCLUDES]
before = common.conf

[Definition]

# Two filter groups: brute-force auth events and abusive traffic events.
# Pick the one you want via the jail; failregex below matches BOTH.
#
# Notes on the regex:
#   - `"sec":true` is a sentinel: it filters out every non-security log
#     line cheaply before the IP regex runs.
#   - `<HOST>` is fail2ban's IPv4/IPv6/hostname token; do NOT replace it.
#   - We match `"event":"<one of>"` with an alternation so a single
#     filter file covers every banworthy event. Scope per-event via
#     `mode=` in the jail file (we don't use that here, but `findtime`
#     and `maxretry` are tuned per jail).

failregex = ^.*"sec":true,"event":"(?:login_fail|login_lockout|csrf_fail|origin_block|rate_limit|rate_limit_pdf|rate_limit_store|rate_limit_store_post|rate_limit_order)","ip":"<HOST>"

# Lines that should never trigger a ban — keep empty unless you have
# specific noise to suppress.
ignoreregex =

# datepattern is left unset → fail2ban uses journald's own timestamp,
# which is the correct source of truth here.

[Init]
journalmatch = CONTAINER_TAG=hisaabo-api
