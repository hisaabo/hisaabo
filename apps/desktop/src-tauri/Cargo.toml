[package]
name = "app"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
# OS-native credential storage for the desktop session token.
# Linux: uses libsecret (requires gnome-keyring / ksecretservice at runtime).
# macOS: Keychain. Windows: Credential Manager.
# We deliberately do NOT fall back to plaintext storage if init fails —
# see save_session_token() for the rationale.
keyring = "3"
