<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Fast, precise, GST-compliant invoicing and business management. Built for Indian businesses that mean business." />
    <meta name="theme-color" content="#5b5bd6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hisaabo" />
    <meta property="og:title" content="Hisaabo — Hisaab, pakka." />
    <meta property="og:description" content="Fast, precise, GST-compliant invoicing for Indian businesses. Free, open-source, self-hostable." />
    <meta property="og:url" content="https://app.hisaabo.in" />
    <meta property="og:image" content="https://app.hisaabo.in/og-image.png" />
    <meta property="og:image:secure_url" content="https://app.hisaabo.in/og-image.png" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hisaabo — Free, open-source, GST-compliant invoicing for Indian businesses." />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hisaabo — Hisaab, pakka." />
    <meta name="twitter:description" content="Fast, precise, GST-compliant invoicing for Indian businesses. Free, open-source, self-hostable." />
    <meta name="twitter:image" content="https://app.hisaabo.in/og-image.png" />
    <meta name="twitter:image:alt" content="Hisaabo — Free, open-source, GST-compliant invoicing for Indian businesses." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- SRI omitted: Cloudflare updates Turnstile without versioned URLs;
         pinning a hash would break on every CDN update. CSP script-src
         restricts loading to challenges.cloudflare.com only. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script>
      (function() {
        var t = localStorage.getItem('hisaabo-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
