# Hisaabo API reverse proxy.
#
# This file is dropped into /etc/nginx/conf.d/ (http context), so http-level
# directives (limit_req_zone, map, geo) live at the top of the file.
#
# ── Client IP trust model ──────────────────────────────────────────────────
# nginx is the single trusted hop in front of the API (API default
# TRUST_PROXY_HOPS=1). It OVERWRITES X-Forwarded-For with the address of the
# peer that connected to it, so a client can never inject its own value, and it
# strips CF-Connecting-IP so the header cannot be forged (the API only honours
# it when TRUST_CLOUDFLARE=true).
#
# If another proxy terminates TLS in front of nginx (Caddy, cloudflared, a cloud
# load balancer), $remote_addr is that proxy's address, which would collapse all
# clients into one rate-limit bucket. Tell nginx which peers to trust with the
# real_ip block below (uncomment and adjust). The rewritten $remote_addr is then
# used for rate limiting, logging and X-Forwarded-For.
#
#   set_real_ip_from 172.16.0.0/12;     # docker network / proxy address
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;
#
# Cloudflare directly in front of nginx: list Cloudflare's published ranges
# (https://www.cloudflare.com/ips-v4 and /ips-v6) with set_real_ip_from and use
#   real_ip_header CF-Connecting-IP;
# Only do this when the origin is reachable exclusively from Cloudflare
# (firewall / Tunnel / Authenticated Origin Pulls); otherwise anyone can spoof it.

# ── Rate / connection limits (per client IP) ───────────────────────────────
# These are coarse flood limits in front of the API's own per-tier limiter
# (see SECURITY.md); they are intentionally above the API's per-minute limits.
limit_req_zone $binary_remote_addr zone=hisaabo_auth:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=hisaabo_trpc:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=hisaabo_api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=hisaabo_store:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=hisaabo_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# ── Scheme as seen by the end user ─────────────────────────────────────────
# nginx itself only speaks plain HTTP (port 80). When a TLS-terminating proxy
# in front sets X-Forwarded-Proto: https, pass that through and emit HSTS.
# HSTS is meaningless (and ignored by browsers) over plain HTTP, so it is only
# sent for requests that arrived over HTTPS at the edge. Only trust this header
# if nginx is NOT directly reachable from the internet.
map $http_x_forwarded_proto $hisaabo_scheme {
    default $scheme;
    https   https;
}
map $hisaabo_scheme $hisaabo_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

upstream api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.hisaabo.in;

    server_tokens off;

    # ── Timeouts (slowloris / slow-body mitigation) ────────────────────────
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    # Default body cap for every location; locations that legitimately accept
    # larger payloads raise it explicitly.
    client_max_body_size 1m;

    limit_conn hisaabo_conn 50;

    # ── Security headers ───────────────────────────────────────────────────
    # add_header is NOT inherited into a location that defines its own
    # add_header, so none of the locations below may use it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hisaabo_hsts always;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    # ── Proxy defaults (inherited by every location below) ─────────────────
    # proxy_set_header is likewise not inherited once a location sets any, so
    # all forwarding headers are defined once, here.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $hisaabo_scheme;
    proxy_set_header CF-Connecting-IP  "";
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Health check endpoint (no logging). `?deep=true` runs SELECT 1 against the
    # database, so it is rate limited like any other API route.
    location = /health {
        access_log off;
        limit_req zone=hisaabo_api burst=20 nodelay;
        proxy_pass http://api;
    }

    # ONCE-style lightweight liveness probe
    location = /up {
        access_log off;
        proxy_pass http://api;
    }

    # Credential-taking procedures (the API's STRICT_PROCEDURES: 20/min per IP,
    # plus per-email limits). A tRPC batch lists procedures comma-separated, so
    # match the names anywhere in the path. This coarse nginx limit sits above
    # the API budget; it exists to shed floods before they reach Node.
    location ~ ^/api/trpc/.*(auth\.(register|login|sendMagicLink|verifyMagicLink|confirmEmailChange)|tenant\.peekInvitation) {
        limit_req zone=hisaabo_auth burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://api;
    }

    # tRPC API (bulk imports can be large)
    location /api/trpc/ {
        limit_req zone=hisaabo_trpc burst=60 nodelay;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_pass http://api;
    }

    # Invoice PDF downloads, party ledger PDFs, logos, item images.
    # (Replaces the former per-path /api/invoices/ and /api/parties/ blocks,
    # which silently dropped Connection/limits/body settings.)
    location /api/ {
        limit_req zone=hisaabo_api burst=20 nodelay;
        client_max_body_size 10m;
        # PDF generation can take a moment
        proxy_read_timeout 60s;
        proxy_pass http://api;
    }

    # Store public API (catalog, orders). Responses are not cached at the proxy
    # layer (no proxy_cache is configured; the API sets its own Cache-Control).
    location /store/ {
        limit_req zone=hisaabo_store burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://api;
    }

    # Carrier webhooks (HMAC-verified by the API)
    location /webhooks/ {
        limit_req zone=hisaabo_api burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://api;
    }

    # UPI deep-link landing page
    location = /pay/upi {
        limit_req zone=hisaabo_store burst=20 nodelay;
        proxy_pass http://api;
    }

    # Everything else (service banner)
    location / {
        limit_req zone=hisaabo_api burst=20 nodelay;
        proxy_pass http://api;
    }
}
