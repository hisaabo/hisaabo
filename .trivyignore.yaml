# Trivy ignore file (YAML form: supports per-path scoping, unlike plain .trivyignore).
# Used by the fs/misconfig scan via `trivyignores: .trivyignore.yaml`
# (TRIVY_IGNOREFILE). Keep every entry scoped to specific files with a reason.
misconfigurations:
  - id: DS-0002   # image should not run as root (no USER instruction)
    paths:
      - Dockerfile.once
    statement: >-
      ONCE all-in-one image: s6-overlay's /init must start as root to supervise
      services, mount-fix /storage and take the flock. Every long-running
      service drops privileges itself (postgres via su-exec postgres; the API
      and its migrations via su-exec node). Only the short root-side steps
      (secret/permission bootstrap, ONCE backup/restore hooks) stay root.
  - id: DS-0002
    paths:
      - Dockerfile.backup
    statement: >-
      Backup sidecar: the entrypoint stays root solely to run busybox crond,
      which switches to the unprivileged `backup` user for the job. backup.sh,
      its credentials (rclone.conf, /etc/backup.env, log, dumps) are owned by
      that user with mode 0600/0700 and umask 077.

# Expo/Metro development-toolchain advisories, accepted for pnpm audit too
# (see SECURITY.md "Accepted dependency advisories"). image-size is only
# reachable via apps/mobile > expo > metro; the fix is image-size 2.x, a major
# Metro does not support. Not part of any shipped image or server runtime.
vulnerabilities:
  - id: CVE-2025-71329
    paths:
      - pnpm-lock.yaml
    statement: >-
      image-size 1.2.1 via Expo/Metro dev toolchain only; fix requires 2.x
      which Metro does not support. Re-check on Expo/Metro upgrades.
  - id: CVE-2025-71330
    paths:
      - pnpm-lock.yaml
    statement: >-
      image-size 1.2.1 via Expo/Metro dev toolchain only; fix requires 2.x
      which Metro does not support. Re-check on Expo/Metro upgrades.
